openapi: 3.1.0
info:
  title: logger-group-read
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'logger-group-read' operation.
    This operation returns the profile of a single logger group of the Spring Boot app, addressed by name.
  # The API itself exists since 1.0.0, but the marker deliberately says 1.2.0: the release in
  # which this contract document was born and the compatibility checks started guarding it.
  # Backdating it to 1.0.0 would make the birth-time shape of the document look like a years-old
  # promise, outlawing legitimate changes (e.g. new required fields) that are perfectly safe here.
  x-axelix-introduced-in: 1.2.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers/group/{name}:
    get:
      operationId: getLoggerGroup
      summary: Returns the profile of a single logger group of the service.
      parameters:
        - name: name
          in: path
          required: true
          description: The name of the logger group to read.
          schema:
            type: string
      responses:
        '200':
          description: The profile of the requested logger group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggersGroupProfile'
        '400':
          description: No logger group with the given name exists.
components:
  schemas:
    LoggersGroupProfile:
      type: object
      description: The logging level information of a single logger group.
      required:
        - name
        - members
      properties:
        name:
          type: string
          description: The name of the logger group.
          x-axelix-introduced-in: 1.2.0
        configuredLevel:
          type: string
          description: The logging level configured for the group, or absent when no level is set.
          x-axelix-introduced-in: 1.2.0
        members:
          type: array
          description: The names of the loggers that belong to this group.
          items:
            type: string
          x-axelix-introduced-in: 1.2.0
