openapi: 3.1.0
info:
  title: logger-feed
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'logger-feed' operation.
    This operation lists every logger and logger group of the Spring Boot app together with the
    logging levels the app supports, so that Axelix Master can render the loggers overview.
  # The API itself exists since 1.0.0, but the marker deliberately says 1.2.0: the release in
  # which this contract document was born and the compatibility checks started guarding it.
  # Backdating it to 1.0.0 would make the birth-time shape of the document look like a years-old
  # promise, outlawing legitimate changes (e.g. new required fields) that are perfectly safe here.
  x-axelix-introduced-in: 1.2.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers:
    get:
      operationId: getAllLoggers
      summary: Lists all loggers, logger groups and supported logging levels of the service.
      responses:
        '200':
          description: The feed of loggers, logger groups and supported logging levels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggersFeed'
components:
  schemas:
    LoggersFeed:
      type: object
      description: The overview of all loggers and logger groups of the service.
      required:
        - levels
        - loggers
        - groups
      properties:
        levels:
          type: array
          description: The logging levels the service supports, ordered from most to least verbose.
          items:
            type: string
          x-axelix-introduced-in: 1.2.0
        loggers:
          type: array
          description: The individual loggers of the service.
          items:
            $ref: '#/components/schemas/LoggersFeedLogger'
          x-axelix-introduced-in: 1.2.0
        groups:
          type: array
          description: The logger groups of the service.
          items:
            $ref: '#/components/schemas/LoggersFeedGroup'
          x-axelix-introduced-in: 1.2.0
    LoggersFeedLogger:
      type: object
      description: A single logger as it appears in the loggers feed.
      required:
        - name
        - effectiveLevel
      properties:
        name:
          type: string
          description: The name of the logger.
          x-axelix-introduced-in: 1.2.0
        configuredLevel:
          type: string
          description: The explicitly configured logging level, or absent when no level is set.
          x-axelix-introduced-in: 1.2.0
        effectiveLevel:
          type: string
          description: The operational logging level currently in use, possibly inherited from a parent.
          x-axelix-introduced-in: 1.2.0
        fallbackLevel:
          type: string
          description: >-
            The level the logger reverts to when its current level is temporary. Absent when the
            current level is permanent.
          x-axelix-introduced-in: 1.2.0
        temporaryLevelInitiatedAt:
          type: string
          description: >-
            The ISO-8601 timestamp at which the temporary level was activated. Absent when the
            current level is permanent.
          x-axelix-introduced-in: 1.2.0
        temporaryLevelRollsBackAt:
          type: string
          description: >-
            The ISO-8601 timestamp at which the temporary level expires and reverts. Absent when
            there is no expiration.
          x-axelix-introduced-in: 1.2.0
    LoggersFeedGroup:
      type: object
      description: A single logger group as it appears in the loggers feed.
      required:
        - name
        - members
      properties:
        name:
          type: string
          description: The name of the logger group.
          x-axelix-introduced-in: 1.2.0
        configuredLevel:
          type: string
          description: The logging level configured for the group, or absent when no level is set.
          x-axelix-introduced-in: 1.2.0
        members:
          type: array
          description: The names of the loggers that belong to this group.
          items:
            type: string
          x-axelix-introduced-in: 1.2.0
