openapi: 3.1.0
info:
  title: logger-level-reset
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'logger-level-reset' operation.
    This operation resets the logging level of a single logger of the Spring Boot app back to
    the level it had before it was changed through Axelix.
  # The API itself exists since 1.0.0, but the marker deliberately says 1.2.0: the release in
  # which this contract document was born and the compatibility checks started guarding it.
  # Backdating it to 1.0.0 would make the birth-time shape of the document look like a years-old
  # promise, outlawing legitimate changes (e.g. new required fields) that are perfectly safe here.
  x-axelix-introduced-in: 1.2.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers/logger/{name}/reset:
    post:
      operationId: resetLogLevelByLoggerName
      summary: Resets the logging level of a single logger of the service to its original value.
      parameters:
        - name: name
          in: path
          required: true
          description: The name of the logger to reset the level of.
          schema:
            type: string
      responses:
        '204':
          description: The logging level was reset.
        '400':
          description: No logger with the given name exists, or its level was never changed.
