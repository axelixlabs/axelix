openapi: 3.1.0
info:
  title: heartbeat-v2
  version: 1.0.0
  description: |
    Version 2 of the heartbeat. This version is a more lightweight version of the heartbeat that 
    does not include all the information needed in order for the service to register itself. Version 2
    includes minimal information so the Master can assume the other peer is alive.
  x-axelix-introduced-in: 1.3.0
  x-axelix-server: master
paths:
  /service/heartbeat/v2:
    post:
      operationId: heartbeatV2
      summary: Accepts the heartbeat of a service instance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartBeatMetadataV2'
      responses:
        '204':
          description: The heartbeat was accepted.
        '409':
          description: The instance is not known to this Axelix Master and has to register itself first.
components:
  schemas:
    HeartBeatMetadataV2:
      type: object
      description: Represents lightweight service instance metadata supplied as part of the continuous heartbeat process.
      required:
        - instanceId
        - healthStatus
        - memoryDetails
        - transactions
      properties:
        healthStatus:
          description: >-
            The health status of the given instance that is reported by the starter infrastructure.
            Never absent.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/HealthStatus'
        instanceId:
          type: string
          description: Unique identifier (uid) of the service.
          x-axelix-introduced-in: 1.3.0
        memoryDetails:
          description: The current memory details of the given instance. Never absent.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/MemoryDetails'
        transactions:
          type: array
          description: >-
            The aggregated information about the transactions inside the instance, accumulated
            since the instance has started.
          x-axelix-introduced-in: 1.3.0
          items:
            $ref: '#/components/schemas/TransactionAggregatedProfile'
    # HealthStatus and everything below it is duplicated verbatim in
    # metadata/metadata-feed.yaml (no cross-document schema reuse yet, see GH-1666). Keep both in sync.
    HealthStatus:
      type: string
      description: The health status of the given instance during registration.
      enum:
        - UP
        - DOWN
        - UNKNOWN
    MemoryDetails:
      type: object
      description: Memory details of the given Instance.
      required:
        - heap
      properties:
        heap:
          type: integer
          format: int64
          description: The estimated heap size of the given instance.
          x-axelix-introduced-in: 1.3.0
    TransactionAggregatedProfile:
      type: object
      description: Aggregated information about a particular transactional method in the instance.
      required:
        - transactionOrigin
        - transactionalKey
        - transactionOverallStats
        - lazyLoadingTargets
        - inMemoryPagination
        - externalCalls
      properties:
        transactionOrigin:
          description: The origin of the transaction, i.e. how exactly the transaction was created.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/TransactionOrigin'
        transactionalKey:
          description: The key that identifies the transactional method.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/TransactionalKey'
        transactionOverallStats:
          description: >-
            The min/max/avg call duration aggregated across every invocation of the transactional
            method.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/ExecutionStats'
        lazyLoadingTargets:
          type: array
          description: The aggregated counts of lazy-loading (N+1) occasions detected in the transaction.
          x-axelix-introduced-in: 1.3.0
          items:
            $ref: '#/components/schemas/CountedLazyLoadingTarget'
        inMemoryPagination:
          type: object
          description: >-
            The in-memory pagination counters detected in the transaction, keyed by the offending
            query.
          x-axelix-introduced-in: 1.3.0
          additionalProperties:
            type: integer
            format: int32
        externalCalls:
          type: array
          description: >-
            The aggregated timing of the blocking calls made to external endpoints from within the
            transaction.
          x-axelix-introduced-in: 1.3.0
          items:
            $ref: '#/components/schemas/ExternalCallInsight'
        propagation:
          type: string
          description: >-
            The declared propagation behavior of the transaction (e.g. 'REQUIRED'). Absent when it
            could not be determined.
          x-axelix-introduced-in: 1.3.0
        isolation:
          type: string
          description: >-
            The declared isolation level of the transaction (e.g. 'DEFAULT'). Absent when it could
            not be determined.
          x-axelix-introduced-in: 1.3.0
        readOnly:
          type: boolean
          description: >-
            Whether the transaction was declared read-only. Absent when it could not be determined
            (e.g. an older agent that did not report it).
          x-axelix-introduced-in: 1.3.0
    TransactionOrigin:
      type: string
      description: The origin of the transaction, i.e. how exactly the transaction was created.
      enum:
        - SPRING_INFRASTRUCTURE
        - APPLICATION_DECLARATIVE
        - APPLICATION_IMPERATIVE
    TransactionalKey:
      type: object
      description: The key that identifies the transactional method.
      required:
        - className
        - methodName
      properties:
        className:
          type: string
          description: The class name that declares the transactional method.
          x-axelix-introduced-in: 1.3.0
        methodName:
          type: string
          description: The name of the transactional method.
          x-axelix-introduced-in: 1.3.0
    ExecutionStats:
      type: object
      description: The min/max/avg duration statistics of repeated executions.
      required:
        - minMs
        - maxMs
        - averageMs
      properties:
        minMs:
          type: integer
          format: int64
          description: The minimum observed duration, in milliseconds.
          x-axelix-introduced-in: 1.3.0
        maxMs:
          type: integer
          format: int64
          description: The maximum observed duration, in milliseconds.
          x-axelix-introduced-in: 1.3.0
        averageMs:
          type: integer
          format: int64
          description: The average observed duration, in milliseconds.
          x-axelix-introduced-in: 1.3.0
    CountedLazyLoadingTarget:
      type: object
      description: The aggregated count of lazy-loading (N+1) occasions for a particular association.
      required:
        - target
        - count
      properties:
        target:
          description: The association that was presumably lazy loaded.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/LazyLoadingTarget'
        count:
          type: integer
          format: int32
          description: The number of lazy-loading occasions observed.
          x-axelix-introduced-in: 1.3.0
    LazyLoadingTarget:
      type: object
      description: The particular association that presumably was lazy loaded.
      required:
        - ownerEntityClass
        - associationPropertyName
      properties:
        ownerEntityClass:
          type: string
          description: The fully qualified name of the entity on which the association was lazy loaded.
          x-axelix-introduced-in: 1.3.0
        associationPropertyName:
          type: string
          description: The name of the lazy-loaded association property.
          x-axelix-introduced-in: 1.3.0
    ExternalCallInsight:
      type: object
      description: >-
        Aggregated timing of the blocking calls made to a single external endpoint from within a
        transactional method, folded across every invocation of that method.
      required:
        - type
        - target
        - stats
      properties:
        type:
          description: The client that performed the call, e.g. an HTTP client or a messaging client.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/TypeExternalCall'
        target:
          type: string
          description: >-
            Where the call went: the request method and url for an HTTP call, e.g.
            'GET https://payments/charge'. The topic / queue / exchange for a messaging call.
          x-axelix-introduced-in: 1.3.0
        stats:
          description: >-
            The min/max/avg call duration aggregated across every invocation of the transactional
            method.
          x-axelix-introduced-in: 1.3.0
          $ref: '#/components/schemas/ExecutionStats'
    TypeExternalCall:
      type: string
      description: The client that performed a blocking call to an external system.
      enum:
        - HTTP_CLIENT
        - KAFKA
        - RABBIT
