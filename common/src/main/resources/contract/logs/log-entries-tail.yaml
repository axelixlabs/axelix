openapi: 3.1.0
info:
  title: log-entries-tail
  version: ""
  description: |
    Schemas for the most recent log entries of a Spring Boot app, kept in the starter's bounded
    in-memory buffer and ordered chronologically with the most recent entry last.
components:
  schemas:
    LogEntriesTail:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.3.0
      type: object
      description: The most recent log entries of the service, in chronological order.
      required:
        - entries
      properties:
        entries:
          type: array
          description: The log entries, the oldest one first.
          items:
            $ref: '#/components/schemas/LogEntry'
          x-axelix-introduced-in: 1.3.0
    LogEntry:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.3.0
      type: object
      description: A single log entry (log event) of the service.
      required:
        - timestamp
        - level
        - logger
        - thread
        - message
      properties:
        timestamp:
          type: integer
          format: int64
          description: The moment the entry was logged at, in milliseconds since the Unix epoch.
          x-axelix-introduced-in: 1.3.0
        level:
          type: string
          description: The level the entry was logged with (e.g. "INFO", "ERROR").
          x-axelix-introduced-in: 1.3.0
        logger:
          type: string
          description: The name of the logger the entry was logged by.
          x-axelix-introduced-in: 1.3.0
        thread:
          type: string
          description: The name of the thread the entry was logged from.
          x-axelix-introduced-in: 1.3.0
        message:
          type: string
          description: The formatted message of the entry.
          x-axelix-introduced-in: 1.3.0
        stackTrace:
          type: string
          description: The stack trace of the exception logged along with the entry. Absent if there is none.
          x-axelix-introduced-in: 1.3.0
