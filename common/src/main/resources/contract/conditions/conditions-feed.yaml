openapi: 3.1.0
info:
  title: conditions-feed
  version: ""
  description: |
    Schemas for the flattened conditions report of a Spring Boot app, covering configuration
    classes whose conditions matched fully or partially.
components:
  schemas:
    ConditionsFeed:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: The flattened version of the conditions response from the actuator endpoint.
      required:
        - positiveMatches
        - negativeMatches
      properties:
        positiveMatches:
          type: array
          description: The list of configuration classes where all conditions matched successfully.
          items:
            $ref: '#/components/schemas/PositiveCondition'
          x-axelix-introduced-in: 1.2.0
        negativeMatches:
          type: array
          description: The list of configuration classes where some conditions did not match.
          items:
            $ref: '#/components/schemas/NegativeCondition'
          x-axelix-introduced-in: 1.2.0
    PositiveCondition:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A configuration class where all conditions matched successfully.
      required:
        - className
        - matched
      properties:
        className:
          type: string
          description: >-
            The name of the class on which either the conditional annotation resided, or that
            contained the method on which the conditional annotation resided.
          x-axelix-introduced-in: 1.2.0
        methodName:
          type: string
          description: The name of the method on which the conditional annotation was put.
          x-axelix-introduced-in: 1.2.0
        matched:
          type: array
          description: The list of conditions that were evaluated and matched.
          items:
            $ref: '#/components/schemas/ConditionMatch'
          x-axelix-introduced-in: 1.2.0
    NegativeCondition:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A configuration class where some conditions did not match.
      required:
        - className
        - notMatched
        - matched
      properties:
        className:
          type: string
          description: >-
            The name of the class on which either the conditional annotation resided, or that
            contained the method on which the conditional annotation resided.
          x-axelix-introduced-in: 1.2.0
        methodName:
          type: string
          description: The name of the method on which the conditional annotation was put.
          x-axelix-introduced-in: 1.2.0
        notMatched:
          type: array
          description: The list of conditions that were not matched.
          items:
            $ref: '#/components/schemas/ConditionMatch'
          x-axelix-introduced-in: 1.2.0
        matched:
          type: array
          description: The list of conditions that were evaluated and matched.
          items:
            $ref: '#/components/schemas/ConditionMatch'
          x-axelix-introduced-in: 1.2.0
    ConditionMatch:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: The result of evaluating a single condition.
      required:
        - condition
        - message
      properties:
        condition:
          type: string
          description: The simple name of the condition class that was evaluated.
          x-axelix-introduced-in: 1.2.0
        message:
          type: string
          description: The descriptive message explaining why the condition matched or did not match.
          x-axelix-introduced-in: 1.2.0
