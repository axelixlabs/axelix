openapi: 3.1.0
info:
  title: caches-feed
  version: ""
  description: |
    Schemas for the cache managers and caches of a Spring Boot app.
components:
  schemas:
    CachesFeed:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: The response of the caches actuator endpoint that contains all cache managers of the application.
      required:
        - cacheManagers
      properties:
        cacheManagers:
          type: array
          description: The list of cache managers in the application.
          items:
            $ref: '#/components/schemas/CacheManagerDto'
          x-axelix-introduced-in: 1.2.0
    CacheManagerDto:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A cache manager together with all the caches inside it.
      required:
        - name
        - caches
      properties:
        name:
          type: string
          description: The name of the cache manager.
          x-axelix-introduced-in: 1.2.0
        caches:
          type: array
          description: The caches inside the given cache manager.
          items:
            $ref: '#/components/schemas/CacheDto'
          x-axelix-introduced-in: 1.2.0
    CacheDto:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A cache inside the cache manager.
      required:
        - name
        - target
        - enabled
        - containsStats
      properties:
        name:
          type: string
          description: The cache name.
          x-axelix-introduced-in: 1.2.0
        target:
          type: string
          description: The fully qualified name of the native cache.
          x-axelix-introduced-in: 1.2.0
        enabled:
          type: boolean
          description: Whether the cache is enabled (true) or disabled (false).
          x-axelix-introduced-in: 1.2.0
        containsStats:
          type: boolean
          description: True if the cache contains either hits or misses, otherwise false.
          x-axelix-introduced-in: 1.2.0
