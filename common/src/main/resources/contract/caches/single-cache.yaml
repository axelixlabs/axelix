openapi: 3.1.0
info:
  title: single-cache
  version: ""
  description: |
    Schemas for a single cache of a Spring Boot app, including its target implementation,
    cache manager, lookup history and enabled state.
components:
  schemas:
    SingleCache:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: The details of the requested cache.
      required:
        - name
        - target
        - cacheManager
        - lookupHistory
        - enabled
      properties:
        name:
          type: string
          description: The cache name.
          x-axelix-introduced-in: 1.2.0
        target:
          type: string
          description: The fully qualified name of the native cache.
          x-axelix-introduced-in: 1.2.0
        cacheManager:
          type: string
          description: The name of the cache manager that manages the current cache.
          x-axelix-introduced-in: 1.2.0
        lookupHistory:
          type: array
          description: The array of all recorded cache lookups. May be empty if unknown.
          items:
            $ref: '#/components/schemas/CacheLookup'
          x-axelix-introduced-in: 1.2.0
        estimatedEntrySize:
          type: integer
          format: int64
          description: The estimated number of entries in the cache, or absent if unknown.
          x-axelix-introduced-in: 1.2.0
        enabled:
          type: boolean
          description: Whether the cache is enabled (true) or disabled (false).
          x-axelix-introduced-in: 1.2.0
    CacheLookup:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A recorded cache lookup.
      required:
        - timestamp
        - outcome
      properties:
        timestamp:
          type: integer
          format: int64
          description: Timestamp when the cache operation occurred, in milliseconds from the Unix epoch.
          x-axelix-introduced-in: 1.2.0
        outcome:
          description: The outcome of the cache lookup.
          x-axelix-introduced-in: 1.2.0
          $ref: '#/components/schemas/LookupOutcome'
    LookupOutcome:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: string
      description: The outcome of a cache lookup.
      enum:
        - HIT
        - MISS
