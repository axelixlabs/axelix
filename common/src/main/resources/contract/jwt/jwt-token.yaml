openapi: 3.1.0
info:
  title: jwt-token
  version: ""
  description: |
    The JWT payload Axelix Master and the starters exchange.

    Master issues MasterJwtToken for users. Technical users exchange TechUserJwtToken in both
    directions between Master and starters. Both payloads include issued-at and expiration claims.
components:
  schemas:
    TechUserJwtToken:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.3.0
      type: object
      additionalProperties: false
      description: JWT payload that identifies the technical user exchanging the token.
      required:
        - sub
        - iat
        - exp
      properties:
        sub:
          type: string
          description: Stable identifier of the technical user. The JWT "sub" claim.
          x-axelix-introduced-in: 1.3.0
        iat:
          type: integer
          format: int64
          description: Issued-at time, as a JWT NumericDate (seconds since the epoch).
          x-axelix-introduced-in: 1.3.0
        exp:
          type: integer
          format: int64
          description: Expiration time, as a JWT NumericDate (seconds since the epoch).
          x-axelix-introduced-in: 1.3.0
    MasterJwtToken:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.3.0
      description: JWT payload issued by Axelix Master and parsed by starters.
      allOf:
        - $ref: '#/components/schemas/JwtClaims'
    JwtClaims:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.3.0
      type: object
      additionalProperties: false
      description: Claims carried by user JWTs issued by Axelix Master.
      required:
        - sub
        - iat
        - exp
        - uid
        - roles
      properties:
        sub:
          type: string
          description: Username of the subject. The JWT "sub" claim.
          x-axelix-introduced-in: 1.3.0
        iat:
          type: integer
          format: int64
          description: Issued-at time, as a JWT NumericDate (seconds since the epoch).
          x-axelix-introduced-in: 1.3.0
        exp:
          type: integer
          format: int64
          description: Expiration time, as a JWT NumericDate (seconds since the epoch).
          x-axelix-introduced-in: 1.3.0
        uid:
          type: string
          description: Stable identifier of the user. Unlike sub, it never changes for a given user.
          x-axelix-introduced-in: 1.3.0
        roles:
          type: array
          description: Roles granted to the subject.
          items:
            $ref: '#/components/schemas/JwtRole'
          x-axelix-introduced-in: 1.3.0
    JwtRole:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.3.0
      type: object
      additionalProperties: false
      description: A role carried inside a JWT, as a name, its own authorities, and nested roles.
      required:
        - name
        - authorities
        - components
      properties:
        name:
          type: string
          description: Name of the role.
          x-axelix-introduced-in: 1.3.0
        authorities:
          type: array
          description: Authority names this role grants on its own, excluding nested roles.
          items:
            type: string
          x-axelix-introduced-in: 1.3.0
        components:
          type: array
          description: Nested roles included in this role.
          items:
            $ref: '#/components/schemas/JwtRole'
          x-axelix-introduced-in: 1.3.0
