openapi: 3.1.0
info:
  title: scheduled-task-cron-expression-modify
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'scheduled-task-cron-expression-modify'
    operation. This operation changes the cron expression of a cron-based scheduled task of the
    Spring Boot app.
  # The API itself exists since 1.0.0, but the marker deliberately says 1.2.0: the release in
  # which this contract document was born and the compatibility checks started guarding it.
  # Backdating it to 1.0.0 would make the birth-time shape of the document look like a years-old
  # promise, outlawing legitimate changes (e.g. new required fields) that are perfectly safe here.
components:
  schemas:
    ScheduledTaskCronExpressionModifyRequest:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A request to change the cron expression of a scheduled task.
      required:
        - trigger
        - cronExpression
      properties:
        trigger:
          type: string
          description: The identifier of the scheduled task to modify.
          x-axelix-introduced-in: 1.2.0
        cronExpression:
          type: string
          description: The new cron expression to be assigned.
          x-axelix-introduced-in: 1.2.0
