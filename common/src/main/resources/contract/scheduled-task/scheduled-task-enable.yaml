openapi: 3.1.0
info:
  title: scheduled-task-enable
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'scheduled-task-enable' operation.
    This operation enables a previously disabled scheduled task of the Spring Boot app.
  # The API itself exists since 1.0.0, but the marker deliberately says 1.2.0: the release in
  # which this contract document was born and the compatibility checks started guarding it.
  # Backdating it to 1.0.0 would make the birth-time shape of the document look like a years-old
  # promise, outlawing legitimate changes (e.g. new required fields) that are perfectly safe here.
  x-axelix-introduced-in: 1.2.0
  x-axelix-server: starter
paths:
  /actuator/axelix-scheduled-tasks/enable:
    post:
      operationId: enableScheduledTask
      summary: Enables a previously disabled scheduled task of the service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledTaskEnableRequest'
      responses:
        '204':
          description: The task was enabled.
        '400':
          description: No scheduled task with the given trigger exists.
components:
  schemas:
    ScheduledTaskEnableRequest:
      type: object
      description: A request to enable a scheduled task.
      required:
        - trigger
      properties:
        trigger:
          type: string
          description: The identifier of the scheduled task to enable.
          x-axelix-introduced-in: 1.2.0
