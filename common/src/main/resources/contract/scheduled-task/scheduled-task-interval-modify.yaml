openapi: 3.1.0
info:
  title: scheduled-task-interval-modify
  version: ""
  description: |
    Schemas for changing the execution interval of a fixed-rate or fixed-delay scheduled task.
components:
  schemas:
    ScheduledTaskIntervalModifyRequest:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A request to change the execution interval of a scheduled task.
      required:
        - trigger
        - interval
      properties:
        trigger:
          type: string
          description: The identifier of the scheduled task to modify.
          x-axelix-introduced-in: 1.2.0
        interval:
          type: integer
          format: int64
          description: The new execution interval, in milliseconds.
          x-axelix-introduced-in: 1.2.0
