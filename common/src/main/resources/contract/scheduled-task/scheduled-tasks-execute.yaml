openapi: 3.1.0
info:
  title: scheduled-task-execute
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'scheduled-task-execute' feature.
    This feature allows to execute the arbitrary scheduled task inside the Spring Boot app.
  # The API itself exists since 1.0.0, but the marker deliberately says 1.2.0: the release in
  # which this contract document was born and the compatibility checks started guarding it.
  # Backdating it to 1.0.0 would make the birth-time shape of the document look like a years-old
  # promise, outlawing legitimate changes (e.g. new required fields) that are perfectly safe here.
  x-axelix-introduced-in: 1.2.0
  x-axelix-server: master
components:
  schemas:
    ScheduledTaskExecuteRequest:
      type: object
      description: A request to forcibly execute a scheduled task.
      required:
        - trigger
      properties:
        trigger:
          type: string
          description: The identifier of the scheduled task to run now.
          x-axelix-introduced-in: 1.2.0
