openapi: 3.1.0
info:
  title: scheduled-task-execute
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'scheduled-task-execute' feature.
    This feature allows to execute the arbitrary scheduled task inside the Spring Boot app.
  x-axelix-introduced-in: 1.0.0
paths:
  /actuator/axelix-scheduled-tasks/execute:
    post:
      operationId: executeScheduledTask
      summary: Forcibly executes a scheduled task of the service, out of its regular schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledTaskExecuteRequest'
      responses:
        '204':
          description: The task was submitted for execution.
        '400':
          description: No scheduled task with the given trigger exists.
components:
  schemas:
    ScheduledTaskExecuteRequest:
      type: object
      description: A request to forcibly execute a scheduled task.
      required:
        - trigger
      properties:
        trigger:
          type: string
          description: The identifier of the scheduled task to run now.
          x-axelix-introduced-in: 1.0.0
