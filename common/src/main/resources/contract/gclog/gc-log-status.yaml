openapi: 3.1.0
info:
  title: gc-log-status
  version: 1.0.0
  description: |
    The Axelix Master <-> starter contract of the 'gc-log-status' operation.
    This operation returns the current status of the garbage collection logging of the Spring Boot
    app: whether it is enabled, at which verbosity level and which levels the JVM supports.
  # The API itself exists since 1.0.0, but the marker deliberately says 1.2.0: the release in
  # which this contract document was born and the compatibility checks started guarding it.
  # Backdating it to 1.0.0 would make the birth-time shape of the document look like a years-old
  # promise, outlawing legitimate changes (e.g. new required fields) that are perfectly safe here.
  x-axelix-introduced-in: 1.2.0
  x-axelix-server: starter
paths:
  /actuator/axelix-gc/log/status:
    get:
      operationId: getGcLogStatus
      summary: Returns the status of the garbage collection logging of the service.
      responses:
        '200':
          description: The status of the garbage collection logging.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GcLogStatus'
components:
  schemas:
    GcLogStatus:
      type: object
      description: The current status of the garbage collection logging.
      required:
        - enabled
        - availableLevels
      properties:
        enabled:
          type: boolean
          description: Whether the GC logging is currently enabled (true) or disabled (false).
          x-axelix-introduced-in: 1.2.0
        level:
          type: string
          description: The verbosity level of the GC logging (e.g. "info", "trace"). Absent if the logging is disabled.
          x-axelix-introduced-in: 1.2.0
        availableLevels:
          type: array
          description: The list of available GC log levels supported by the JVM.
          items:
            type: string
          x-axelix-introduced-in: 1.2.0
