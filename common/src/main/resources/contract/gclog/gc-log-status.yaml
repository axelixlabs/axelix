openapi: 3.1.0
info:
  title: gc-log-status
  version: ""
  description: |
    Schemas for the garbage collection logging status of a Spring Boot app, including its enabled
    state, current verbosity and the levels supported by the JVM.
components:
  schemas:
    GcLogStatus:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.2.0
      type: object
      description: The current status of the garbage collection logging.
      required:
        - enabled
        - availableLevels
      properties:
        enabled:
          type: boolean
          description: Whether the GC logging is currently enabled (true) or disabled (false).
          x-axelix-introduced-in: 1.2.0
        level:
          type: string
          description: The verbosity level of the GC logging (e.g. "info", "trace"). Absent if the logging is disabled.
          x-axelix-introduced-in: 1.2.0
        availableLevels:
          type: array
          description: The list of available GC log levels supported by the JVM.
          items:
            type: string
          x-axelix-introduced-in: 1.2.0
