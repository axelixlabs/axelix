openapi: 3.1.0
info:
  title: gc-log-enable
  version: ""
  description: |
    Schemas for enabling garbage collection logging in a Spring Boot app at a given verbosity level.
components:
  schemas:
    GcLogEnableRequest:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.2.0
      type: object
      description: A request to enable the GC logging.
      required:
        - level
      properties:
        level:
          type: string
          description: The GC log level to apply (e.g. info, debug, trace).
          x-axelix-introduced-in: 1.2.0
