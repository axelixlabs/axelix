# Activate with: --spring.profiles.active=local
# Requires a local Axelix Master running on :8080. Without this profile the app boots standalone and
# does not try to self-register, which keeps the GH-1708 boot check self-contained.
axelix.sbs.discovery.auto=true
axelix.sbs.discovery.instance-name=api-gateway-gradle-sb-4
axelix.sbs.discovery.instance-actuator-url=http://localhost:8096/actuator
axelix.sbs.discovery.master-url=http://localhost:8080/api/internal/service/register
