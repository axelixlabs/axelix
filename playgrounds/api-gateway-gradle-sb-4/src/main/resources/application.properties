spring.application.name=api-gateway-gradle-sb-4
server.port=8096

# Expose actuator endpoints so Axelix Master can introspect this instance.
management.endpoints.web.exposure.include=*

# Axelix requires a JWT signing key to authenticate traffic from Axelix Master. Sample key for the
# playground only — generate your own for anything real.
axelix.sbs.auth.jwt.algorithm=HMAC512
axelix.sbs.auth.jwt.signing-key=22573444698685aa77750b88ad6e99ef1f94a7a909bc7df63f7a80666208c201ab7a584e6e05e6c9d0aa94b723f843ff

# The single backend this gateway forwards to (operator-configured, never caller-controlled).
gateway.upstream-base-url=https://httpbin.org/get
