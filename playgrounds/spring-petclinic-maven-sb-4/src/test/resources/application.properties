# AXELIX
axelix.sbs.auth.jwt.algorithm=HMAC512
axelix.sbs.auth.jwt.signing-key=22573444698685aa77750b88ad6e99ef1f94a7a909bc7df63f7a80666208c201ab7a584e6e05e6c9d0aa94b723f843ff

# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql,classpath*:db/${database}/test-schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql,classpath*:db/${database}/test-data.sql

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Internationalization
spring.messages.basename=messages/messages

# PayGrid external payment provider - mirrored from the main application.properties so that
# full-context @SpringBootTest slices can build the payGridRestClient bean (the test
# application.properties shadows the main one on the classpath).
paygrid.host=${PAYGRID_HOST:https://eu-west.paygrid.example.com}
spring.ssl.bundle.pem.paygrid.keystore.certificate=classpath:ssl/paygrid/client.crt
spring.ssl.bundle.pem.paygrid.keystore.private-key=classpath:ssl/paygrid/client.key
spring.ssl.bundle.pem.paygrid.truststore.certificate=classpath:ssl/paygrid/ca.crt

# Actuator
management.endpoints.web.exposure.include=*
