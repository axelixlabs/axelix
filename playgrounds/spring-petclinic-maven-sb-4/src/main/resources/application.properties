# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql,classpath*:db/${database}/test-schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql,classpath*:db/${database}/test-data.sql
# Web
spring.thymeleaf.mode=HTML

# Feature flags
petclinic.vet.feedback.enabled=true

# PayGrid external payment provider (Devoxx demo: "David's day")
# The host is picked per datacenter via an env var, for the lowest latency - which is exactly
# why nobody can tell at a glance which one a running instance actually resolved.
paygrid.host=${PAYGRID_HOST:https://eu-west.paygrid.example.com}
# The nightly payment batch is scheduled for 02:00.
payments.batch.cron=0 0 2 * * *
# Runtime environment marker. Ops renamed "production" to "prod" and told nobody; the
# VaultApiTokenInterceptor's @ConditionalOnProperty still expects "production", so the
# no-op (test) interceptor silently wins here - see the payments package.
environment=prod

# PayGrid requires mutual TLS - the client certificate is presented from the "paygrid" bundle.
spring.ssl.bundle.pem.paygrid.keystore.certificate=classpath:ssl/paygrid/client.crt
spring.ssl.bundle.pem.paygrid.keystore.private-key=classpath:ssl/paygrid/client.key
spring.ssl.bundle.pem.paygrid.truststore.certificate=classpath:ssl/paygrid/ca.crt

# Cache
spring.cache.cache-names=vets,owners,pets

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.info.env.enabled=true
management.info.os.enabled=true
management.info.java.enabled=true
management.info.ssl.enabled=true
management.info.process.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.endpoint.heapdump.access=unrestricted

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE
logging.file.name=application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# Deprecated properties (intentional - exercise Axelix deprecated-property detection)
# WARNING-level deprecation: still bound, superseded by spring.main.banner-mode
spring.main.show-banner=true
# ERROR-level deprecation: no longer supported, no replacement
spring.application.index=1
