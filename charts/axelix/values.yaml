# -- Configuration for ingress K8S resource to be created.
ingress:

  # -- Whether to create a dedicated ingress K8S resource for external access to the axelix master ui. Default is 'true'.
  # Switch to 'false' if you already have an ingress to add rules into. In case enabled is left as 'true', then please
  # ensure the correct ingress controller is installed in the cluster. The default expected ingress controller is nginx.
  enabled: true

  # -- Name of the created ingress.
  name: "axelix-master"

  # -- Namespace where the ingress is supposed to be created. If not set, defaults to the release namespace.
  namespace: ""

  # -- Class name of the ingress. Default is 'nginx'.
  className: "nginx"

  # -- Additional annotations for ingress, if any.
  annotations: {}

  # -- Host of the ingress. By default, the host is empty.
  host: ""

  # -- TLS settings for the provided host.
  tls:
    # -- Whether tls is enabled for the host. Default is false.
    enabled: false

    # -- The name of the secret that stores the certificate and private key for it.
    secretName: ""

rbac:

  # -- List of namespaces where the Axelix Master service account will be granted permissions. For each namespace,
  # a Role and RoleBinding are created (when 'autoCreateRole = true'), so a single service account can access
  # resources across multiple namespaces. The default namespace to be scanned is "default" namespace. These are
  # the same namespaced that are going to be scanned for pods for auto-registration.
  targetNamespaces: [ "default" ]

  # -- Whether to create the Role and Role-Binding for Axelix service account. Default is 'true'. If overridden
  # to false, then the end-user MUST ensure that Axelix service account either has required privileges to access the
  # K8S KubeApi server, or the Axelix is not deployed under the auto discovery mode at all.
  autoCreateRole: true

# -- Array of secret names to be used when pulling the Axelix images
imagePullSecrets: []

# -- Additional raw environment variables to inject into the Axelix Master container, as a list of standard
# Kubernetes env entries (each with a "name" and a "value" or "valueFrom"). Use this to configure any Axelix Master
# property that is not surfaced as a first-class value below. This is especially useful for the full HashiCorp Vault
# connection/authentication surface (approle, kubernetes, TLS, namespace, ...), which binds under the
# AXELIX_MASTER_EXTERNAL_CONFIG_SPRING_CLOUD_VAULT_* prefix. For example:
#   extraEnv:
#     - name: AXELIX_MASTER_EXTERNAL_CONFIG_SPRING_CLOUD_VAULT_AUTHENTICATION
#       value: "KUBERNETES"
#     - name: AXELIX_MASTER_EXTERNAL_CONFIG_SPRING_CLOUD_VAULT_KUBERNETES_ROLE
#       value: "axelix-master"
extraEnv: []

# -- The name to be given to deployment and container inside pods.
name: "axelix-master"

# -- Configuration for the service account to be attached to Axelix Master pods.
serviceAccount:

  # -- Name of the service account to create (if 'create = true') or name of an existing service account to be mounted into Axelix pods.
  # Default: the same name as the backend deployment.
  name: "axelix-master"

  # -- Whether to create service account for the backend pods or rely on an existing one. Default - true (i.e. a new service
  # account should be created).
  create: true

  # --  Namespace of the service account, where if not creating, existing service account resides. If new
  # service account will be created (see "create" setting), then this setting represents the name of the
  # namespace where a new service account will be created. If not set, defaults to the release namespace.
  namespace: ""

  # -- Annotations for the newly created service account. By default, there are no annotations. No-Op if "create: false".
  annotations: {}

  # -- Whether to automount the service account into pod or not. Default is true.
  automount: true

# -- Custom pod spec.
pod:
  # -- Security context of the axelix master pods.
  securityContext: {}
  # -- Custom pod labels.
  labels: {}
  # -- Custom pod annotations, if any. By default, pod has no annotations.
  annotations: {}

# -- Custom deployment config.
deployment:

  # -- The name to be given to axelix master deployment.
  name: "axelix-master"

  # -- Custom labels for the K8S Axelix Master deployment
  labels: {}

  # -- Custom annotations for the K8S Axelix Master deployment
  annotations: {}

image:

  # -- Reference to the axelix master image to be used. Can either be a human-readable "tag" like 1.2.1, or
  # might be the sha256 image hash, like sha256:<SHA_VALUE>. If not set, defaults to the appVersion of the chart.
  ref: ""

  # -- Name of the image, including repository prefix, like "ghcr.io/axelixlabs/axelix"
  name: "ghcr.io/axelixlabs/axelix"

  # -- Image pull policy
  pullPolicy: "IfNotPresent"

# -- Liveness probes configuration
liveness:
  delay: 15
  failureThreshold: 10
  timeoutSeconds: 10
  period: 5
# -- Readiness probes configuration
readiness:
  delay: 15
  failureThreshold: 10
  timeoutSeconds: 10
  period: 5

# -- Resource quotas (limits and requests of memory and cpu) to be used by axelix master pods.
resources: {}

# -- Additional volume mounts to be used (expecting a corresponding "volume" definition)
volumeMounts: []

# -- Additional volumes to be attached to the axelix master pods
volumes: []

# -- The node selector for the Axelix Master pods. By default, any node is capable to run the pod.
nodeSelector: {}

# -- Custom affinity rules for the Axelix Master pods. By default, there are no rules.
affinity: {}

# -- Array of tolerations for the Axelix Master. By default, pods do not define any tolerations.
tolerations: []

# -- Configuration of the K8S Service resource for the Axelix Master.
service:

  # -- Whether the service should be crated or not. The default is true. By default, the standard ClusterIP service
  # will be created.
  create: true

  # -- The name of the service to be used.
  name: "axelix-master"

  # -- Port configuration of the K8S service allocated for the Axelix Master. 2935 by default.
  port:

    # -- The name of the port.
    name: http

    # -- The target port of the ClusterIP service. If left unset, defaults to the port the Axelix Master listens
    # on, i.e. to 'axelix.master.port'.
    target: "" # @schema type:[integer, string]

    # -- The source port of the ClusterIP service.
    source: 2935

# -- The Axelix application-related settings.
axelix:
  master:
    # -- The HTTP port the Axelix Master listens on inside the container - the UI, the REST API and the MCP server
    # all share it. Since Axelix 1.2.0 the default is 2935 (it used to be 8080). The chart uses this value for the
    # container port, the probes and, unless 'service.port.target' is set, for the target port of the service.
    port: 2935

    # -- The auth-related settings.
    auth:
      # -- The auth cookie-related settings.
      cookie:
        # -- Whether the cookie should be marked with 'Secured;' attribute in response from Axelix Master to the browser.
        # In production environments this setting should be 'true'.
        secure: true

      # -- The JWT-related Axelix settings.
      jwt:
        # -- The algorithm to be used for signing the JWTs. One of 'HMAC256', 'HMAC384' or 'HMAC512'. Optional since
        # Axelix 1.2.0: if left empty, Axelix Master falls back to 'HMAC512'.
        algorithm: ""
        # -- The key to be used for signing the JWTs. Optional since Axelix 1.2.0: if left empty, Axelix Master falls
        # back to a built-in signing key. Beware that the built-in key is publicly known, so anyone can use it to forge
        # a session. It is acceptable for a trial only - in any real environment set your own key here (and the same key
        # in every managed service).
        signingKey: ""
        # -- The lifespan of the created JWTs.
        lifespan: 12h

      # -- The auth-options settings.
      options:
        # -- Super-Admin login configuration options.
        superAdmin:
          # -- Credentials of the Super-Admin.
          credentials:
            # -- Username of the Super-Admin.
            username: admin
            # -- Password of the Super-Admin.
            password: admin
        # -- Local login (via a local database) configuration options.
        local:
          # -- Whether the Local login is enabled.
          enabled: false
        # -- Login via OIDC/OAuth2 configuration options.
        oauth2:
          # -- Whether the login via OIDC/OAuth2 configuration options.
          enabled: false
          # -- The URL of the OIDC issuer. Required if the OIDC/OAuth2 Login flow is enabled.
          issuerUri: ""
          # -- Base URL of this Axelix Master distribution. This is the URL that must point to the Axelix Master, i.e. the URL
          # from which Axelix Master is available. Required if the OIDC/OAuth2 Login flow is enabled.
          baseUrl: ""
          # -- The OAuth2 client-id. Required if the OIDC/OAuth2 Login flow is enabled.
          clientId: ""
          # -- The OAuth2 client-secret. Required if the OIDC/OAuth2 Login flow is enabled.
          clientSecret: ""
          # -- The JMESPath expression to be used for extracting/deducing the role from the /userinfo endpoint response.
          # If not specified, then any user that logs-in via OIDC flow has only VIEWER role by default.
          roleAttributePath: ""
          # -- The scopes to be requested during OAuth2 flow by the Axelix Master. OpenID scope is mandatory, since Axelix Master needs it to get the id_token.
          scopes: openid

    # -- Axelix Master settings related to the database
    database:
      # -- JDBC URL to be used when connecting to the database. By default, Axelix Master uses SQLite.
      url: jdbc:sqlite:axelix.db
      # -- Username to be used when accessing the database.
      username: ""
      # -- Password to be used when accessing the database.
      password: ""

    # -- Discovery-related settings.
    discovery:
      # -- Settings related to self-registration mechanism.
      selfRegistration:
        # -- Whether the self-registration is enabled in master. By default, self-registration is disabled.
        enabled: false
        # -- Settings related to eviction of self-registered instances. Make sense only in case the self-registration is enabled.
        eviction:
          # -- The interval during which the Axelix Master, if have not received any heartbeats, assumes the instance to be
          # unavailable and thus de-registers it internally.
          heartbeatTimeout: 45s
          # -- Cron schedule of the periodic job that cleans up the stale self-registered instances.
          schedule: "0 * * * * *"

      # -- Settings related to automatic discovery mechanism.
      auto:
        # -- Whether the automatic discovery is enabled in master. By default, automatic discovery is enabled.
        enabled: true
        # -- Settings related to automatic discovery job. Make sense only in case the automatic discovery is enabled.
        broadcast:
          # -- Cron schedule of the periodic job that automatically scans the K8S cluster for Spring Boot services to be managed.
          schedule: "0 * * * * *"
        # -- K8S-related settings. When performing automatic discovery, Axelix Master queries the K8S Control Plane, thus it needs certain.
        # configuration to make things right.
        kubernetes:
          # -- The URL of the K8S Api Server. By default, it is constructed from the environment variables, that are supposed to be injected in
          # every pod. Can be overridden, if needed.
          kubeApiserverUrl: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}
          # -- The path to the Service Account token inside the Axelix Master pods.
          saTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
          # -- The path to the Certification Authority certificate (need so the Axelix Master can trust the K8S Control Plane).
          caCertPath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # -- Filters, applies during the automatic discovery (e.g. Axelix Master may scan only pods with the given labels).
          filters:
            # -- Labels of the pods that are supposed to be managed by Axelix. There is a special placeholder "*" (the star)
            # that signals that any value of the label is acceptable.
            labels: {}

    # -- MCP Server related settings.
    mcpServer:
        # -- Whether the MCP Server is enabled. When enabled, Axelix Master exposes an MCP-compatible
        # endpoint at /api/mcp that can be used by MCP clients. Default is 'true'.
        enabled: true

    # -- External configuration settings. When enabled, Axelix Master imports part (or all) of its configuration
    # from an external source at startup. Two sources are supported and may be enabled independently.
    externalConfig:

      # -- Spring Cloud Config Server settings. When enabled, Axelix Master fetches its configuration from a
      # Spring Cloud Config Server at startup.
      springCloudConfig:
        # -- Whether Axelix Master should fetch its configuration from a Spring Cloud Config Server. Default is 'false'.
        enabled: false
        # -- URI of the Spring Cloud Config Server, e.g. "http://config-server:8888". Required when enabled.
        uri: ""
        # -- The label (e.g. the git branch/tag) of the configuration to fetch. Default is 'master'.
        label: "master"
        # -- The name of the application whose configuration to fetch. If empty, Axelix Master uses its own
        # application name ("axelix").
        name: ""
        # -- Username for HTTP Basic authentication against the Config Server, if it requires authentication.
        username: ""
        # -- Password for HTTP Basic authentication against the Config Server, if it requires authentication.
        password: ""

      # -- HashiCorp Vault settings. When enabled, Axelix Master fetches its configuration/secrets from HashiCorp
      # Vault at startup. Only the most common connection options are exposed here as first-class values; any
      # additional Spring Cloud Vault property (authentication-specific settings for approle/kubernetes, TLS/SSL,
      # namespace, ...) can be supplied through the top-level 'extraEnv' using the
      # AXELIX_MASTER_EXTERNAL_CONFIG_SPRING_CLOUD_VAULT_* prefix.
      springCloudVault:
        # -- Whether Axelix Master should fetch its configuration from HashiCorp Vault. Default is 'false'.
        enabled: false
        # -- Whether a failure to connect to Vault aborts Axelix Master startup. Default is 'true'.
        failFast: true
        # -- The Vault endpoint URI, e.g. "https://vault:8200". Required when enabled.
        uri: ""
        # -- The Vault authentication method, e.g. "TOKEN", "KUBERNETES", "APPROLE". When empty, Vault's own
        # default ("TOKEN") is used.
        authentication: ""
        # -- The Vault token, used when the authentication method is "TOKEN".
        token: ""
        # -- Key-Value (KV) secrets engine settings.
        kv:
          # -- Whether the KV secrets backend is enabled. Default is 'true'.
          enabled: true
          # -- Name of the KV secrets engine mount. Default is 'secret'.
          backend: "secret"
          # -- The default context (path) under which to look up secrets. Default is 'application'.
          defaultContext: "application"
          # -- Separator between the application name and the active profile when composing secret paths. Default is '/'.
          profileSeparator: "/"
          # -- The application name used when composing secret paths. Defaults to the Axelix Master application name ("axelix").
          applicationName: "axelix"

    # -- Logical name of the environment Axelix Master runs in, e.g. "production" or "staging". When set and JSON
    # logging is enabled, it is attached to the structured log output. Empty by default.
    environment: ""

    # -- Logging settings.
    logging:
      # -- Structured JSON logging settings.
      json:
        # -- Whether to emit logs as ECS-structured JSON to the console (useful for log aggregation systems).
        # Default is 'false'.
        enabled: false

    # -- Observability / metrics export settings.
    metrics:
      # -- OpenTelemetry (OTLP) metrics export settings. When enabled, Axelix Master pushes its metrics to an
      # OTLP-compatible collector over HTTP/protobuf.
      otlp:
        # -- Whether OTLP metrics export is enabled. Default is 'false'.
        enabled: false
        # -- Full URL of the OTLP HTTP/protobuf metrics endpoint, e.g. "http://otel-collector:4318/v1/metrics".
        # Required when enabled.
        url: ""
        # -- Interval between metric exports. Default is '1m'.
        step: "1m"
        # -- Compression mode for export requests. One of 'none' or 'gzip'. Default is 'none'.
        compressionMode: "none"
        # -- Headers to add to every OTLP export request, as key/value pairs (e.g. for authenticating against the
        # collector). Keys should be simple (letters, digits); for header names containing other characters use the
        # top-level 'extraEnv' instead.
        headers: {}

      # -- Prometheus metrics settings. Exposes a Prometheus scrape endpoint for Axelix Master.
      prometheus:
        # -- Whether the Prometheus scrape endpoint is enabled. When enabled, metrics are exposed at
        # '/api/actuator/prometheus'. Default is 'false'.
        enabled: false
        # -- Port of a dedicated HTTP server that serves the Prometheus scrape endpoint. If left unset, the endpoint
        # is served via the main Axelix Master port ('axelix.master.port'). Must be between 1 and 65535 if set. When set,
        # the chart also declares a matching container port named "prometheus".
        port: "" # @schema type:[integer, string]
        # -- Common tags (key/value pairs) to attach to every metric exposed via the Prometheus endpoint. Keys
        # should be simple (letters, digits); for tag keys containing other characters use the top-level 'extraEnv'.
        tags: {}

    # -- Database migration settings. By default, migrations run with the same credentials as the 'database'
    # settings above. Override these only if migrations must run as a different (e.g. more privileged) database user.
    migrations:
      # -- Username for running database migrations. If empty, falls back to 'axelix.master.database.username'.
      username: ""
      # -- Password for running database migrations. If empty, falls back to 'axelix.master.database.password'.
      password: ""