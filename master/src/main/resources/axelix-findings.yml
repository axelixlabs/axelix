# Allocate new IDs sequentially. Keep published IDs stable and never reuse retired IDs.

# OPEN_IN_VIEW
AXLX-1000:
  technology: CONFIGURATION
  concern: PERFORMANCE
  property-checks:
    - property: spring.jpa.open-in-view
      value: "true"
      alternative: "false"
      rationale: >-
        Open Session In View keeps the persistence context open for the whole duration of the request, which
        hides the transaction boundaries, silently triggers lazy loading in the view layer and, as a
        consequence, leads to the N+1 problem and to the database connections being held much longer than
        necessary.
    - property: spring.jpa.open-in-view
      alternative: "false"
      rationale: >-
        Open Session In View keeps the persistence context open for the whole duration of the request, which
        hides the transaction boundaries, silently triggers lazy loading in the view layer and, as a
        consequence, leads to the N+1 problem and to the database connections being held much longer than
        necessary.

# DDL_AUTO_CREATE
AXLX-1001:
  technology: CONFIGURATION
  concern: RELIABILITY
  property-checks:
    - property: spring.jpa.hibernate.ddl-auto
      value: "create"
      alternative: "validate"
      rationale: >-
        Hibernate recreates the whole schema on every startup, which means a guaranteed data loss. This is
        acceptable for a throwaway local setup, but never for an environment whose data matters.
    - property: spring.jpa.hibernate.ddl-auto
      value: "create-drop"
      alternative: "validate"
      rationale: >-
        Hibernate creates the schema on startup and drops it on shutdown, which means a guaranteed data
        loss. This is acceptable for a throwaway local setup, but never for an environment whose data
        matters.
    - property: spring.jpa.hibernate.ddl-auto
      value: "update"
      alternative: "validate"
      rationale: >-
        Hibernate alters the schema implicitly at runtime, based on whatever the entity mapping happens to
        be. The resulting migration is neither reviewed nor reproducible, and Hibernate never drops or
        renames anything, so the schema silently drifts away from the mapping. A dedicated migration tool,
        such as Liquibase or Flyway, is the way to evolve a schema you care about.

# LIQUIBASE_DROP_FIRST
AXLX-1002:
  technology: CONFIGURATION
  concern: RELIABILITY
  property-checks:
    - property: spring.liquibase.drop-first
      value: "true"
      alternative: "false"
      rationale: >-
        Liquibase drops existing database objects before running migrations at startup. If the application
        points to a production database, a restart can erase tables and their data.

# FLYWAY_CLEAN_ENABLED
AXLX-1003:
  technology: CONFIGURATION
  concern: RELIABILITY
  property-checks:
    - property: spring.flyway.clean-disabled
      value: "false"
      alternative: "true"
      rationale: >-
        This permits Flyway's clean operation to run against the configured schemas. An accidental clean
        against production can delete tables and their data.

# SHOW_SQL
AXLX-1004:
  technology: CONFIGURATION
  concern: PERFORMANCE
  property-checks:
    - property: spring.jpa.show-sql
      value: "true"
      alternative: "false"
      rationale: >-
        The generated SQL is printed straight to the standard output, bypassing the logging subsystem
        entirely, so it can be neither formatted, nor filtered, nor correlated with anything else. Raising
        the 'org.hibernate.SQL' logger to DEBUG achieves the same goal without any of that.

# HIBERNATE_JDBC_BIND_TRACE
AXLX-1005:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: logging.level.org.hibernate.orm.jdbc.bind
      value: "TRACE"
      alternative: "INFO"
      rationale: >-
        Hibernate logs the values it binds to SQL parameters, including personal data or tokens. These
        values can reach application logs even if the statement fails or the transaction rolls back. To
        inspect SQL statements, use the org.hibernate.SQL logger at DEBUG.

# HIBERNATE_JDBC_EXTRACT_TRACE
AXLX-1006:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: logging.level.org.hibernate.orm.jdbc.extract
      value: "TRACE"
      alternative: "INFO"
      rationale: >-
        Hibernate logs values it reads from JDBC results, which can include sensitive stored data. Those
        values can reach application logs even if they are never returned to the caller. To inspect SQL
        statements, use the org.hibernate.SQL logger at DEBUG.

# ENABLE_LAZY_LOAD_NO_TRANS
AXLX-1007:
  technology: CONFIGURATION
  concern: PERFORMANCE
  property-checks:
    - property: spring.jpa.properties.hibernate.enable_lazy_load_no_trans
      value: "true"
      alternative: "false"
      rationale: >-
        Every lazy association accessed outside of a transaction is loaded in a separate short-lived session
        of its own. This masks the missing transaction boundaries instead of exposing them, and turns a
        LazyInitializationException into a swarm of unnoticed queries.

# INCLUDE_STACKTRACE_ALWAYS
AXLX-1008:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: server.error.include-stacktrace
      value: "always"
      alternative: "never"
      rationale: >-
        The stack trace is included into every error response, which exposes the internals of the
        application, the libraries it is built upon and their versions to whoever is on the other side of
        the wire.
    - property: server.error.include-stacktrace
      value: "on-param"
      alternative: "never"
      rationale: >-
        Clients can ask Spring Boot to include stack traces in error responses. Those traces reveal internal
        class names and library details that help callers map the application.
    - property: spring.web.error.include-stacktrace
      value: "always"
      alternative: "never"
      rationale: >-
        Spring Boot includes stack traces in error responses whenever a trace is available. These traces
        reveal internal class and method names and which libraries the application uses.
    - property: spring.web.error.include-stacktrace
      value: "on-param"
      alternative: "never"
      rationale: >-
        Clients can ask Spring Boot to include stack traces in error responses. Those traces reveal internal
        class names and library details that help callers map the application.

