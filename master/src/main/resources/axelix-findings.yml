# INCLUDE_EXCEPTION
AXLX-1011:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: server.error.include-exception
      value: "true"
      alternative: "false"
      rationale: >-
        Spring Boot can include the fully qualified exception class name in HTTP error responses. This
        reveals internal class and package names that can help callers identify the application components
        and libraries behind a failure.
    - property: spring.web.error.include-exception
      value: "true"
      alternative: "false"
      rationale: >-
        Spring Boot can include the fully qualified exception class name in HTTP error responses. This
        reveals internal class and package names that can help callers identify the application components
        and libraries behind a failure.

# MVC_LOG_REQUEST_DETAILS
AXLX-1012:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: spring.mvc.log-request-details
      value: "true"
      alternative: "false"
      rationale: >-
        Spring MVC can log unmasked request parameters and headers when DEBUG or TRACE logging is active.
        This can put sensitive form values, session cookies, or authorization tokens in application logs.

# CODEC_LOG_REQUEST_DETAILS
AXLX-1013:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: spring.codec.log-request-details
      value: "true"
      alternative: "false"
      rationale: >-
        Reactive HTTP codecs can log form values at DEBUG and headers at TRACE. This can put sensitive form
        values, session cookies, or authorization tokens in application logs.
    - property: spring.http.codecs.log-request-details
      value: "true"
      alternative: "false"
      rationale: >-
        Reactive HTTP codecs can log form values at DEBUG and headers at TRACE. This can put sensitive form
        values, session cookies, or authorization tokens in application logs.

# IMMEDIATE_SHUTDOWN
AXLX-1014:
  technology: CONFIGURATION
  concern: RELIABILITY
  property-checks:
    - property: server.shutdown
      value: "immediate"
      alternative: "graceful"
      rationale: >-
        Immediate shutdown can interrupt in-flight HTTP requests during restarts and deployments. Graceful
        shutdown gives active requests time to complete.

# ENV_SHOW_VALUES_ALWAYS
AXLX-1015:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: management.endpoint.env.show-values
      value: "always"
      alternative: "never"
      rationale: >-
        The Actuator env endpoint can return environment values without masking them. Anyone with endpoint
        access could see credentials or API tokens stored in environment properties. Use the Axelix UI or
        MCP server to inspect environment properties and keep the standard Actuator env endpoint unexposed.

# CONFIGPROPS_SHOW_VALUES_ALWAYS
AXLX-1016:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: management.endpoint.configprops.show-values
      value: "always"
      alternative: "never"
      rationale: >-
        The Actuator configprops endpoint can return configuration values without masking them. Anyone with
        endpoint access could see passwords or tokens bound to configuration beans. Use the Axelix UI or MCP
        server to inspect configuration properties and keep the standard Actuator configprops endpoint
        unexposed.

# EXPOSURE_INCLUDE_ALL
AXLX-1017:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: management.endpoints.web.exposure.include
      value: "*"
      alternative: "health,info"
      rationale: >-
        Every actuator endpoint present on the classpath is exposed over HTTP, including the ones that dump
        the heap, the thread stacks, the environment and the configuration properties. The endpoints that
        are actually needed are better listed explicitly.

# H2_CONSOLE_ENABLED
AXLX-1018:
  technology: CONFIGURATION
  concern: SECURITY
  property-checks:
    - property: spring.h2.console.enabled
      value: "true"
      alternative: "false"
      rationale: >-
        This enables the H2 development console over HTTP. Anyone who can reach the console and sign in can
        run SQL to read, change, or delete database data.
