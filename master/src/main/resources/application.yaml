# These are the default settings for Axelix Master for ANY distribution of Axelix.
server:
  port: 8080

spring:
  autoconfigure:
    # OTLP metrics export is owned by OtlpTransportMetricsAutoConfiguration, not Spring Boot.
    exclude: org.springframework.boot.micrometer.metrics.autoconfigure.export.otlp.OtlpMetricsExportAutoConfiguration
  cloud:
    compatibility-verifier:
      # TODO: This is a temporary fix, until we wait for the official cloud support of boot 4.1
      compatible-boot-versions: 4.1.x
  application:
    name: axelix
  ai:
    mcp:
      server:
        enabled: ${axelix.master.mcp-server.enabled}
        protocol: streamable
        name: "axelix-mcp-server"
        # Ant-like value placeholder is substituted by Gradle resources task
        version: "@project.version@"
        streamable-http:
          mcp-endpoint: "/api/mcp"
  datasource:
    url: ${axelix.master.database.url}
    username: ${axelix.master.database.username}
    password: ${axelix.master.database.password}

management:
  endpoint:
    health:
      enabled: true
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: [ "health" ]
  prometheus:
    metrics:
      export:
        enabled: ${axelix.master.metrics.prometheus.enabled}

axelix:
  master:
    external-config:
      spring-cloud-config:
        enabled: false
        uri:
        label: master
        name:
        username:
        password:
      spring-cloud-vault:
        enabled: false
        uri:
        host:
        port:
        namespace:
        authentication:
        token:
        app-role:
          role-id:
          secret-id:
          role:
          app-role-path:
        kubernetes:
          role:
          kubernetes-path:
          service-account-token-file:
        kv:
          enabled:
          backend:
          defaultContext:
          profileSeparator:
          application-name:
        ssl:
          trust-store:
          trust-store-password:
          key-store:
          key-store-password:
    environment:
    logging:
      json:
        enabled: false
    metrics:
      otlp:
        enabled: false
        url:
        step: 1m
        headers: {}
        compression-mode: none
      prometheus:
        enabled: false
        # tags:
    web:
      static-resources:
        location: classpath:/spa/
    mcp-server:
      enabled: true
    database:
      url: jdbc:sqlite:axelix.db
      username: ""
      password:
    migrations:
      username: ${axelix.master.database.username:}
      password: ${axelix.master.database.password:}
    discovery:
      self-registration:
        enabled: true
        eviction:
          heartbeat-timeout: 45s
          schedule: "0 * * * * *"
      auto:
        enabled: false
        broadcast:
          schedule: "0 * * * * *"
        kubernetes:
          kube-apiserver-url: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}
          sa-token-path: /var/run/secrets/kubernetes.io/serviceaccount/token
          ca-cert-path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          filters:
            namespaces: default
            # labels:
    auth:
      jwt:
        lifespan: 12h
      options:
        super-admin:
          credentials:
            username: admin
            password: admin
        local:
          enabled: false
        oauth2:
          enabled: false
          issuer-uri:
          base-url:
          client-id:
          client-secret:
          role-attribute-path:
          job-title-attribute-path:
          organizational-unit-attribute-path:
          scopes: openid
      cookie:
        secure: false
---
spring:
  config:
    # We have to make the spring.config.import 'optional' here in any case (regardless of whether the
    # spring.cloud.config.enabled is true or not). The reasoning is as follows.
    #
    # spring.config.import is a separate mechanism - it is part of Spring Boot, not Spring Cloud. For every
    # location listed here Spring Boot asks each ConfigDataLocationResolver "can you handle this?". The
    # 'configserver:' resolver is contributed by Spring Cloud Config, and - this is the key point - it answers
    # "yes" ONLY when spring.cloud.config.enabled is true (its isResolvable() literally returns the value of
    # that property). So spring.cloud.config.enabled is evaluated at this resolvability gate, BEFORE any request
    # to the Config Server is ever made:
    #
    #   - enabled=false -> the resolver declines 'configserver:', no other resolver claims it, and NOTHING is
    #     fetched (no HTTP call). But an unresolvable location that is NOT optional is a hard startup error in
    #     Spring Boot. That is exactly why we mark it 'optional:' - so Spring Boot silently skips it and Master
    #     boots normally without a Config Server.
    #   - enabled=true  -> the resolver handles the location and actually contacts the server; combined with
    #     fail-fast=true below, an unreachable Config Server then becomes a startup failure.
    #
    # In other words, 'optional:' only covers the disabled case; it does NOT weaken fail-fast when enabled.
    import:
      - "optional:configserver:"
      - "optional:vault://"
  cloud:
    config:
      enabled:   "${axelix.master.external-config.spring-cloud-config.enabled:false}"
      fail-fast: true
      uri:       "${axelix.master.external-config.spring-cloud-config.uri:}"
      label:     "${axelix.master.external-config.spring-cloud-config.label:}"
      name:      "${axelix.master.external-config.spring-cloud-config.name:}"
      username:  "${axelix.master.external-config.spring-cloud-config.username:}"
      password:  "${axelix.master.external-config.spring-cloud-config.password:}"
    vault:
      enabled:        "${axelix.master.external-config.spring-cloud-vault.enabled:false}"
      fail-fast:      true
      uri:            "${axelix.master.external-config.spring-cloud-vault.uri:}"
      host:           "${axelix.master.external-config.spring-cloud-vault.host:}"
      port:           "${axelix.master.external-config.spring-cloud-vault.port:}"
      namespace:      "${axelix.master.external-config.spring-cloud-vault.namespace:}"
      authentication: "${axelix.master.external-config.spring-cloud-vault.authentication:}"
      token:          "${axelix.master.external-config.spring-cloud-vault.token:}"
      app-role:
        role-id:       "${axelix.master.external-config.spring-cloud-vault.app-role.role-id:}"
        secret-id:     "${axelix.master.external-config.spring-cloud-vault.app-role.secret-id:}"
        role:          "${axelix.master.external-config.spring-cloud-vault.app-role.role:}"
        app-role-path: "${axelix.master.external-config.spring-cloud-vault.app-role.app-role-path:}"
      kubernetes:
        role:                       "${axelix.master.external-config.spring-cloud-vault.kubernetes.role:}"
        kubernetes-path:            "${axelix.master.external-config.spring-cloud-vault.kubernetes.kubernetes-path:}"
        service-account-token-file: "${axelix.master.external-config.spring-cloud-vault.kubernetes.service-account-token-file:}"
      kv:
        enabled:          "${axelix.master.external-config.spring-cloud-vault.kv.enabled:}"
        backend:          "${axelix.master.external-config.spring-cloud-vault.kv.backend:}"
        defaultContext:   "${axelix.master.external-config.spring-cloud-vault.kv.defaultContext:}"
        profileSeparator: "${axelix.master.external-config.spring-cloud-vault.kv.profileSeparator:}"
        application-name: "${axelix.master.external-config.spring-cloud-vault.kv.application-name:}"
      ssl:
        trust-store:          "${axelix.master.external-config.spring-cloud-vault.ssl.trust-store:}"
        trust-store-password: "${axelix.master.external-config.spring-cloud-vault.ssl.trust-store-password:}"
        key-store:            "${axelix.master.external-config.spring-cloud-vault.ssl.key-store:}"
        key-store-password:   "${axelix.master.external-config.spring-cloud-vault.ssl.key-store-password:}"