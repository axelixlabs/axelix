ecosystem: LOGGING
projects:
  - id: slf4j
    name: SLF4J
    status: ACTIVE
    summary: >-
      Actively developed. The de facto logging facade of the Java ecosystem, including the bridges
      that route other logging APIs onto it.
    coordinates:
      - org.slf4j:slf4j-api
      - org.slf4j:jcl-over-slf4j
      - org.slf4j:jul-to-slf4j
      - org.slf4j:log4j-over-slf4j
      - org.slf4j:slf4j-ext
      - org.slf4j:slf4j-jdk-platform-logging
      - org.slf4j:slf4j-jdk14
      - org.slf4j:slf4j-log4j12
      - org.slf4j:slf4j-nop
      - org.slf4j:slf4j-reload4j
      - org.slf4j:slf4j-simple
    reference:
      label: SLF4J
      url: https://www.slf4j.org/

  - id: logback
    name: Logback
    status: ACTIVE
    summary: Actively developed. The logging backend Spring Boot configures by default.
    coordinates:
      - ch.qos.logback:logback-classic
      - ch.qos.logback:logback-core
    reference:
      label: Logback
      url: https://logback.qos.ch/

  - id: log4j2
    name: Apache Log4j 2
    status: ACTIVE
    summary: Actively developed by the Apache Logging Services project.
    coordinates:
      - org.apache.logging.log4j:log4j-api
      - org.apache.logging.log4j:log4j-core
      - org.apache.logging.log4j:log4j-slf4j-impl
      - org.apache.logging.log4j:log4j-slf4j2-impl
      - org.apache.logging.log4j:log4j-to-slf4j
      - org.apache.logging.log4j:log4j-jul
      - org.apache.logging.log4j:log4j-layout-template-json
    reference:
      label: Apache Log4j 2
      url: https://logging.apache.org/log4j/2.x/

  - id: log4j1
    name: Apache Log4j 1
    status: SUNSET
    summary: >-
      Reached end of life in August 2015 and is no longer maintained; known issues, security ones
      included, will not be fixed. Users are urged to upgrade to Log4j 2.
    coordinates:
      - log4j:log4j
    succession:
      kind: SUPERSEDED_BY
      value: org.apache.logging.log4j:log4j-core
    reference:
      label: Log4j 1 end-of-life announcement
      url: https://logging.apache.org/log4j/1.x/
