ecosystem: OBSERVABILITY
projects:
  - id: spring-cloud-sleuth
    name: Spring Cloud Sleuth
    status: SUNSET
    summary: >-
      Discontinued after the 3.1.x line and moved to the Spring attic. Tracing moved into
      Micrometer Tracing, which Spring Boot autoconfigures from 3.0 onward.
    coordinates:
      - org.springframework.cloud:spring-cloud-starter-sleuth
      - org.springframework.cloud:spring-cloud-sleuth-api
      - org.springframework.cloud:spring-cloud-sleuth-autoconfigure
      - org.springframework.cloud:spring-cloud-sleuth-instrumentation
      - org.springframework.cloud:spring-cloud-sleuth-brave
      - org.springframework.cloud:spring-cloud-sleuth-zipkin
      - org.springframework.cloud:spring-cloud-sleuth-core
      - org.springframework.cloud:spring-cloud-starter-zipkin
    succession:
      kind: SUPERSEDED_BY
      value: io.micrometer:micrometer-tracing
    reference:
      label: Spring Cloud Sleuth in the attic
      url: https://github.com/spring-attic/spring-cloud-sleuth
