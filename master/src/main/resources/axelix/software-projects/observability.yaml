ecosystem: OBSERVABILITY
projects:
  - id: spring-cloud-sleuth
    name: Spring Cloud Sleuth
    status: SUNSET
    summary: >-
      Discontinued after the 3.1.x line and moved to the Spring attic. Tracing moved into
      Micrometer Tracing, which Spring Boot autoconfigures from 3.0 onward.
    coordinates:
      - org.springframework.cloud:spring-cloud-starter-sleuth
      - org.springframework.cloud:spring-cloud-sleuth-api
      - org.springframework.cloud:spring-cloud-sleuth-autoconfigure
      - org.springframework.cloud:spring-cloud-sleuth-instrumentation
      - org.springframework.cloud:spring-cloud-sleuth-brave
      - org.springframework.cloud:spring-cloud-sleuth-zipkin
      - org.springframework.cloud:spring-cloud-sleuth-core
      - org.springframework.cloud:spring-cloud-starter-zipkin
    succession:
      kind: SUPERSEDED_BY
      value: io.micrometer:micrometer-tracing
    reference:
      label: Spring Cloud Sleuth in the attic
      url: https://github.com/spring-attic/spring-cloud-sleuth

  - id: prometheus-simpleclient
    name: Prometheus Java Client 0.x (simpleclient)
    status: MAINTENANCE
    summary: >-
      The 0.x simpleclient generation is legacy: development moved to the rewritten 1.x
      prometheus-metrics client, and the last simpleclient release line is 0.16.x.
    coordinates:
      - io.prometheus:simpleclient
      - io.prometheus:simpleclient_common
      - io.prometheus:simpleclient_hotspot
      - io.prometheus:simpleclient_httpserver
      - io.prometheus:simpleclient_pushgateway
      - io.prometheus:simpleclient_servlet
    succession:
      kind: SUPERSEDED_BY
      value: io.prometheus:prometheus-metrics-core
    reference:
      label: simpleclient migration guide
      url: https://prometheus.github.io/client_java/migration/simpleclient/

  - id: micrometer
    name: Micrometer
    status: ACTIVE
    summary: >-
      Actively developed. The metrics and tracing facade Spring Boot builds its observability on,
      including the vendor registries and the tracing bridges that replaced Spring Cloud Sleuth.
    coordinates:
      - io.micrometer:context-propagation
      - io.micrometer:micrometer-commons
      - io.micrometer:micrometer-core
      - io.micrometer:micrometer-jakarta9
      - io.micrometer:micrometer-java11
      - io.micrometer:micrometer-java21
      - io.micrometer:micrometer-jetty11
      - io.micrometer:micrometer-jetty12
      - io.micrometer:micrometer-observation
      - io.micrometer:micrometer-observation-test
      - io.micrometer:micrometer-registry-appoptics
      - io.micrometer:micrometer-registry-atlas
      - io.micrometer:micrometer-registry-azure-monitor
      - io.micrometer:micrometer-registry-cloudwatch2
      - io.micrometer:micrometer-registry-datadog
      - io.micrometer:micrometer-registry-dynatrace
      - io.micrometer:micrometer-registry-elastic
      - io.micrometer:micrometer-registry-ganglia
      - io.micrometer:micrometer-registry-graphite
      - io.micrometer:micrometer-registry-health
      - io.micrometer:micrometer-registry-humio
      - io.micrometer:micrometer-registry-influx
      - io.micrometer:micrometer-registry-jmx
      - io.micrometer:micrometer-registry-kairos
      - io.micrometer:micrometer-registry-new-relic
      - io.micrometer:micrometer-registry-opentsdb
      - io.micrometer:micrometer-registry-otlp
      - io.micrometer:micrometer-registry-prometheus
      - io.micrometer:micrometer-registry-prometheus-simpleclient
      - io.micrometer:micrometer-registry-signalfx
      - io.micrometer:micrometer-registry-stackdriver
      - io.micrometer:micrometer-registry-statsd
      - io.micrometer:micrometer-registry-wavefront
      - io.micrometer:micrometer-test
      - io.micrometer:micrometer-tracing
      - io.micrometer:micrometer-tracing-bridge-brave
      - io.micrometer:micrometer-tracing-bridge-otel
      - io.micrometer:micrometer-tracing-integration-test
      - io.micrometer:micrometer-tracing-reporter-wavefront
      - io.micrometer:micrometer-tracing-test
    reference:
      label: Micrometer
      url: https://micrometer.io/

  - id: zipkin-brave
    name: OpenZipkin Brave
