  - id: undertow
    name: Undertow
    status: ACTIVE
    summary: >-
      Actively developed by Red Hat. Spring Boot 4 however no longer supports Undertow as an
      embedded server and its BOM no longer manages it, so Boot applications on Undertow have
      to move to Tomcat or Jetty when upgrading to Boot 4.
    coordinates:
      - io.undertow:undertow-core
      - io.undertow:undertow-servlet
      - io.undertow:undertow-websockets-jsr
    reference:
      label: Undertow
      url: https://undertow.io/

