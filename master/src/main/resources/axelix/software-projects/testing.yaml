      - org.seleniumhq.selenium:selenium-json
      - org.seleniumhq.selenium:selenium-manager
      - org.seleniumhq.selenium:selenium-node-kubernetes
      - org.seleniumhq.selenium:selenium-remote-driver
      - org.seleniumhq.selenium:selenium-safari-driver
      - org.seleniumhq.selenium:selenium-session-map-jdbc
      - org.seleniumhq.selenium:selenium-session-map-redis
      - org.seleniumhq.selenium:selenium-support
    reference:
      label: Selenium
      url: https://www.selenium.dev/

  - id: jsonassert
    name: JSONassert
    status: DORMANT
    summary: >-
      Shows no signs of life: the last release, 1.5.3, and the last commit both date to July 2024,
      although the project was never formally discontinued.
    coordinates:
      - org.skyscreamer:jsonassert
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: JSONassert keeps working; JsonUnit and AssertJ's JSON support are the common actively developed alternatives
    reference:
      label: JSONassert
      url: https://github.com/skyscreamer/JSONassert

  - id: json-path
    name: Jayway JsonPath
    status: ACTIVE
    summary: >-
      Maintained on a slow cadence.
    coordinates:
      - com.jayway.jsonpath:json-path
      - com.jayway.jsonpath:json-path-assert
    reference:
      label: JsonPath
      url: https://github.com/json-path/JsonPath

  - id: htmlunit
    name: HtmlUnit
    status: ACTIVE
    summary: >-
      Actively maintained. Since version 3, published under org.htmlunit instead of
      net.sourceforge.htmlunit.
    coordinates:
      - org.htmlunit:htmlunit
    reference:
      label: HtmlUnit
      url: https://www.htmlunit.org/
  - id: duct-tape
    name: Duct Tape
    status: SUNSET
    summary: >-
      The repository was archived in 2021; the last release was 1.0.8 in 2019. Still shipped as a
      Testcontainers 1.x dependency for retry utilities.
    coordinates:
      - org.rnorth.duct-tape:duct-tape
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: Testcontainers 1.x still ships it; no successor exists.
    reference:
      label: duct-tape repository (archived)
      url: https://github.com/rnorth/duct-tape

  - id: opentest4j
    name: OpenTest4J
    status: ACTIVE
    summary: >-
      Maintained by the JUnit team with ongoing repository activity, though no release has shipped
      since 1.3.0 in July 2023. The common assertion-error protocol underneath JUnit 5.
    coordinates:
      - org.opentest4j:opentest4j
    reference:
      label: OpenTest4J
      url: https://github.com/ota4j-team/opentest4j

  - id: apiguardian
    name: API Guardian
    status: ACTIVE
    summary: >-
      Maintained by the JUnit team with ongoing repository activity, though no release has shipped
      since 1.1.2 in 2021. Provides the @API status annotations used across the JUnit 5 artifacts.
    coordinates:
      - org.apiguardian:apiguardian-api
    reference:
      label: API Guardian
      url: https://github.com/apiguardian-team/apiguardian

  - id: objenesis
    name: Objenesis
    status: ACTIVE
    summary: >-
      Actively maintained. Instantiates objects without constructors; arrives transitively through
      Mockito.
    coordinates:
      - org.objenesis:objenesis
    reference:
      label: Objenesis
      url: https://objenesis.org/

