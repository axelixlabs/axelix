ecosystem: TESTING
projects:
  - id: junit4
    name: JUnit 4
    status: MAINTENANCE
    summary: >-
      Officially in maintenance mode: only critical bugs and security issues are fixed, all other
      issues and pull requests are declined. Ongoing development happens in JUnit 5.
    coordinates:
      - junit:junit
    succession:
      kind: SUPERSEDED_BY
      value: org.junit.jupiter:junit-jupiter
    reference:
      label: JUnit 4 maintenance notice
      url: https://github.com/junit-team/junit4

  - id: junit-framework
    name: JUnit Framework (JUnit 5+)
    status: ACTIVE
    summary: >-
      Actively developed. The modern JUnit generation - the Jupiter API on top of the JUnit
      Platform - and the successor of JUnit 4; the current line is 6.x.
    coordinates:
      - org.junit.jupiter:junit-jupiter
      - org.junit.jupiter:junit-jupiter-api
      - org.junit.jupiter:junit-jupiter-engine
      - org.junit.jupiter:junit-jupiter-migrationsupport
      - org.junit.jupiter:junit-jupiter-params
      - org.junit.platform:junit-platform-commons
      - org.junit.platform:junit-platform-console
      - org.junit.platform:junit-platform-engine
      - org.junit.platform:junit-platform-launcher
      - org.junit.platform:junit-platform-reporting
      - org.junit.platform:junit-platform-suite
      - org.junit.platform:junit-platform-suite-api
      - org.junit.platform:junit-platform-suite-engine
      - org.junit.platform:junit-platform-testkit
      - org.junit.vintage:junit-vintage-engine
    reference:
      label: JUnit Framework
      url: https://junit.org/

  - id: mockito
    name: Mockito
    status: ACTIVE
    summary: Actively developed.
    coordinates:
      - org.mockito:mockito-core
      - org.mockito:mockito-android
      - org.mockito:mockito-errorprone
      - org.mockito:mockito-junit-jupiter
      - org.mockito:mockito-proxy
      - org.mockito:mockito-subclass
    reference:
      label: Mockito
      url: https://site.mockito.org/

  - id: assertj
    name: AssertJ
    status: ACTIVE
    summary: Actively developed.
    coordinates:
      - org.assertj:assertj-core
      - org.assertj:assertj-guava
    reference:
      label: AssertJ
      url: https://assertj.github.io/doc/

