  - id: awaitility
    name: Awaitility
    status: ACTIVE
    summary: >-
      Actively maintained.
    coordinates:
      - org.awaitility:awaitility
      - org.awaitility:awaitility-groovy
      - org.awaitility:awaitility-kotlin
      - org.awaitility:awaitility-scala
    reference:
      label: Awaitility
      url: https://github.com/awaitility/awaitility

  - id: hamcrest
    name: Hamcrest
    status: DORMANT
    summary: >-
      Quiet since early 2025: the latest release, 3.0, dates to August 2024 and the repository has
      seen no commits since February 2025, although the project was never formally discontinued.
    coordinates:
      - org.hamcrest:hamcrest
      - org.hamcrest:hamcrest-core
      - org.hamcrest:hamcrest-library
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: Hamcrest keeps working and remains embedded in the JUnit ecosystem; AssertJ is the common actively developed alternative
    reference:
      label: Hamcrest
      url: https://hamcrest.org/JavaHamcrest/

  - id: xmlunit
    name: XMLUnit
    status: ACTIVE
    summary: >-
      Actively maintained.
    coordinates:
      - org.xmlunit:xmlunit-assertj
      - org.xmlunit:xmlunit-assertj3
      - org.xmlunit:xmlunit-core
      - org.xmlunit:xmlunit-jakarta-jaxb-impl
      - org.xmlunit:xmlunit-legacy
      - org.xmlunit:xmlunit-matchers
      - org.xmlunit:xmlunit-placeholders
    reference:
      label: XMLUnit
      url: https://www.xmlunit.org/

  - id: selenium
    name: Selenium
    status: ACTIVE
    summary: >-
      Actively developed by the Selenium project.
    coordinates:
      - org.seleniumhq.selenium:htmlunit3-driver
      - org.seleniumhq.selenium:selenium-api
      - org.seleniumhq.selenium:selenium-chrome-driver
      - org.seleniumhq.selenium:selenium-chromium-driver
