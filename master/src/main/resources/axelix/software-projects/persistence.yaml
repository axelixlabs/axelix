  - id: apache-derby
    name: Apache Derby
    status: DORMANT
    summary: >-
      The last release, 10.17.1.0, dates to November 2023. The repository still sees occasional
      activity and the project has not been moved to the attic, but nothing has shipped for years.
    coordinates:
      - org.apache.derby:derby
      - org.apache.derby:derbyclient
      - org.apache.derby:derbynet
      - org.apache.derby:derbyoptionaltools
      - org.apache.derby:derbyshared
      - org.apache.derby:derbytools
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: For embedded use, H2 and HSQLDB are the common actively maintained alternatives
    reference:
      label: Apache Derby
      url: https://db.apache.org/derby/

  - id: hsqldb
    name: HSQLDB
    status: ACTIVE
    summary: >-
      Developed on a slow but historically steady cadence; the latest release, 2.7.4, dates to
      November 2024.
    coordinates:
      - org.hsqldb:hsqldb
    reference:
      label: HSQLDB
      url: https://hsqldb.org/

  - id: jtds
    name: jTDS
    status: DORMANT
    summary: >-
      The last release, 1.3.1, was published in 2014 and the project has been inactive since,
      although it was never formally discontinued. Microsoft's own SQL Server driver is the
      maintained way to reach the same databases.
    coordinates:
      - net.sourceforge.jtds:jtds
    succession:
      kind: SUPERSEDED_BY
      value: com.microsoft.sqlserver:mssql-jdbc
    reference:
      label: jTDS on SourceForge
      url: https://sourceforge.net/projects/jtds/

