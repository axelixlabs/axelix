ecosystem: PERSISTENCE
projects:
  - id: hikaricp
    name: HikariCP
    status: ACTIVE
    summary: >-
      Actively developed. The JDBC connection pool Spring Boot autoconfigures by default.
    coordinates:
      - com.zaxxer:HikariCP
    reference:
      label: HikariCP on GitHub
      url: https://github.com/brettwooldridge/HikariCP

  - id: hibernate-orm
    name: Hibernate ORM
    status: ACTIVE
    summary: >-
      Actively developed. The JPA provider Spring Boot autoconfigures by default for spring-data-jpa
      applications.
    coordinates:
      - org.hibernate.orm:hibernate-agroal
      - org.hibernate.orm:hibernate-ant
      - org.hibernate.orm:hibernate-c3p0
      - org.hibernate.orm:hibernate-community-dialects
      - org.hibernate.orm:hibernate-core
      - org.hibernate.orm:hibernate-envers
      - org.hibernate.orm:hibernate-graalvm
      - org.hibernate.orm:hibernate-hikaricp
      - org.hibernate.orm:hibernate-jcache
      - org.hibernate.orm:hibernate-micrometer
      - org.hibernate.orm:hibernate-processor
      - org.hibernate.orm:hibernate-scan-jandex
      - org.hibernate.orm:hibernate-spatial
      - org.hibernate.orm:hibernate-testing
      - org.hibernate.orm:hibernate-vector
    reference:
      label: Hibernate ORM releases
      url: https://hibernate.org/orm/releases/

  - id: flyway
    name: Flyway
    status: ACTIVE
    summary: >-
      Actively developed by Redgate. Since Flyway 10, support for individual databases ships as
      separate flyway-database-* modules on top of flyway-core.
    coordinates:
      - org.flywaydb:flyway-command-test-connection
      - org.flywaydb:flyway-commandline
      - org.flywaydb:flyway-core
      - org.flywaydb:flyway-database-cassandra
      - org.flywaydb:flyway-database-db2
      - org.flywaydb:flyway-database-derby
      - org.flywaydb:flyway-database-hsqldb
      - org.flywaydb:flyway-database-informix
      - org.flywaydb:flyway-database-nc-couchbase
      - org.flywaydb:flyway-database-nc-mongodb
      - org.flywaydb:flyway-database-oracle
      - org.flywaydb:flyway-database-postgresql
      - org.flywaydb:flyway-database-redshift
      - org.flywaydb:flyway-database-saphana
      - org.flywaydb:flyway-database-snowflake
      - org.flywaydb:flyway-database-sybasease
      - org.flywaydb:flyway-firebird
      - org.flywaydb:flyway-gcp-bigquery
      - org.flywaydb:flyway-gcp-spanner
      - org.flywaydb:flyway-mysql
      - org.flywaydb:flyway-singlestore
      - org.flywaydb:flyway-sqlserver
    reference:
      label: Flyway releases
      url: https://github.com/flyway/flyway/releases

  - id: liquibase
    name: Liquibase
    status: ACTIVE
    summary: Actively developed.
    coordinates:
      - org.liquibase:liquibase-cdi
      - org.liquibase:liquibase-core
    reference:
      label: Liquibase releases
      url: https://github.com/liquibase/liquibase/releases

  - id: h2
    name: H2 Database
    status: ACTIVE
    summary: >-
      Actively developed. The embedded database Spring Boot picks up automatically for local
      development and tests.
    coordinates:
      - com.h2database:h2
    reference:
      label: H2 releases
      url: https://github.com/h2database/h2database/releases

  - id: postgresql-jdbc
    name: PostgreSQL JDBC Driver
    status: ACTIVE
    summary: Actively developed by the pgjdbc team.
    coordinates:
      - org.postgresql:postgresql
    reference:
      label: PostgreSQL JDBC Driver
      url: https://jdbc.postgresql.org/

  - id: mysql-connector-j
    name: MySQL Connector/J
    status: ACTIVE
    summary: Actively developed by Oracle alongside the MySQL server.
    coordinates:
      - com.mysql:mysql-connector-j
    reference:
      label: MySQL Connector/J releases
      url: https://github.com/mysql/mysql-connector-j

  - id: mariadb-connector-j
    name: MariaDB Connector/J
    status: ACTIVE
    summary: Actively developed by MariaDB Corporation.
    coordinates:
      - org.mariadb.jdbc:mariadb-java-client
    reference:
      label: MariaDB Connector/J releases
      url: https://github.com/mariadb-corporation/mariadb-connector-j/releases

  - id: mssql-jdbc
    name: Microsoft JDBC Driver for SQL Server
    status: ACTIVE
    summary: Actively developed by Microsoft.
    coordinates:
      - com.microsoft.sqlserver:mssql-jdbc
    reference:
      label: mssql-jdbc releases
      url: https://github.com/microsoft/mssql-jdbc/releases

  - id: oracle-jdbc
    name: Oracle Database JDBC Driver
    status: ACTIVE
    summary: >-
      Actively developed by Oracle alongside the Oracle Database. Covers the ojdbc drivers, the UCP
      connection pool and the companion jars they pull in.
    coordinates:
      - com.oracle.database.jdbc:ojdbc11
      - com.oracle.database.jdbc:ojdbc11-production
      - com.oracle.database.jdbc:ojdbc17
      - com.oracle.database.jdbc:ojdbc17-production
      - com.oracle.database.jdbc:ojdbc8
      - com.oracle.database.jdbc:ojdbc8-production
      - com.oracle.database.jdbc:rsi
      - com.oracle.database.jdbc:ucp
      - com.oracle.database.jdbc:ucp11
      - com.oracle.database.jdbc:ucp17
      - com.oracle.database.ha:ons
      - com.oracle.database.ha:simplefan
      - com.oracle.database.nls:orai18n
      - com.oracle.database.security:oraclepki
      - com.oracle.database.xml:xdb
      - com.oracle.database.xml:xmlparserv2
    reference:
      label: Oracle JDBC downloads
      url: https://www.oracle.com/database/technologies/appdev/jdbc.html

  - id: db2-jcc
    name: IBM Db2 JCC Driver
    status: ACTIVE
    summary: Actively developed by IBM alongside Db2.
    coordinates:
      - com.ibm.db2:jcc
    reference:
      label: Db2 JDBC driver versions
      url: https://www.ibm.com/support/pages/db2-jdbc-driver-versions-and-downloads

  - id: sqlite-jdbc
    name: SQLite JDBC Driver
    status: ACTIVE
    summary: Actively developed by the Xerial project.
    coordinates:
      - org.xerial:sqlite-jdbc
    reference:
      label: sqlite-jdbc releases
      url: https://github.com/xerial/sqlite-jdbc/releases

  - id: apache-derby
    name: Apache Derby
    status: ACTIVE
    summary: >-
      Developed by the Apache DB project. Releases are infrequent, but the project has not been moved
      to the attic.
    coordinates:
      - org.apache.derby:derby
      - org.apache.derby:derbyclient
      - org.apache.derby:derbynet
      - org.apache.derby:derbyoptionaltools
      - org.apache.derby:derbyshared
      - org.apache.derby:derbytools
    reference:
      label: Apache Derby
      url: https://db.apache.org/derby/

  - id: hsqldb
    name: HSQLDB
    status: ACTIVE
    summary: Actively developed.
    coordinates:
      - org.hsqldb:hsqldb
    reference:
      label: HSQLDB
      url: https://hsqldb.org/

  - id: jtds
    name: jTDS
    status: SUNSET
    summary: >-
      The last release, 1.3.1, was published in 2014 and the project has been inactive since.
      Microsoft's own SQL Server driver is the maintained way to reach the same databases.
    coordinates:
      - net.sourceforge.jtds:jtds
    succession:
      kind: SUPERSEDED_BY
      value: com.microsoft.sqlserver:mssql-jdbc
    reference:
      label: jTDS on SourceForge
      url: https://sourceforge.net/projects/jtds/

  - id: jaybird
    name: Jaybird
    status: ACTIVE
    summary: The JDBC driver for Firebird, actively developed by the Firebird project.
    coordinates:
      - org.firebirdsql.jdbc:jaybird
    reference:
      label: Jaybird releases
      url: https://github.com/FirebirdSQL/jaybird/releases
