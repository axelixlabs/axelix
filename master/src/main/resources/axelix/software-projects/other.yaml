ecosystem: OTHER
projects:
  - id: spring-statemachine
    name: Spring Statemachine
    status: SUNSET
    summary: >-
      Discontinued and moved to the Spring attic. The repository is archived and no further
      releases of any kind are expected.
    coordinates:
      - org.springframework.statemachine:spring-statemachine-core
      - org.springframework.statemachine:spring-statemachine-starter
      - org.springframework.statemachine:spring-statemachine-autoconfigure
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: No successor project exists; replacing it means adopting another state machine library or hand-rolled state handling
    reference:
      label: Spring Statemachine in the attic
      url: https://github.com/spring-attic/spring-statemachine

  - id: commons-pool1
    name: Apache Commons Pool 1
    status: DORMANT
    summary: >-
      The 1.x line has not seen a release since 1.6 in 2013, although it was never formally
      discontinued. Development continues only in Commons Pool 2, which lives under different
      coordinates.
    coordinates:
      - commons-pool:commons-pool
    succession:
      kind: SUPERSEDED_BY
      value: org.apache.commons:commons-pool2
    reference:
      label: Apache Commons Pool
      url: https://commons.apache.org/proper/commons-pool/

  - id: commons-pool2
    name: Apache Commons Pool 2
    status: ACTIVE
    summary: Actively maintained by the Apache Commons project. The successor line of Commons Pool 1.
    coordinates:
      - org.apache.commons:commons-pool2
    reference:
      label: Apache Commons Pool
      url: https://commons.apache.org/proper/commons-pool/

  - id: reactor
    name: Project Reactor
    status: ACTIVE
    summary: >-
      Actively developed. The reactive foundation of the Spring portfolio; Reactor Netty is the
      default WebFlux runtime.
    coordinates:
      - io.projectreactor.addons:reactor-adapter
      - io.projectreactor.addons:reactor-extra
      - io.projectreactor.addons:reactor-pool
      - io.projectreactor.addons:reactor-pool-micrometer
      - io.projectreactor.kotlin:reactor-kotlin-extensions
      - io.projectreactor.netty:reactor-netty
      - io.projectreactor.netty:reactor-netty-core
      - io.projectreactor.netty:reactor-netty-http
      - io.projectreactor.netty:reactor-netty-http-brave
      - io.projectreactor.netty:reactor-netty-quic
      - io.projectreactor:reactor-core
      - io.projectreactor:reactor-core-micrometer
      - io.projectreactor:reactor-test
      - io.projectreactor:reactor-tools
    reference:
      label: Project Reactor
      url: https://projectreactor.io/

  - id: rxjava3
    name: RxJava 3
    status: ACTIVE
    summary: >-
      The 3.x line is actively developed; the earlier 1.x and 2.x lines are end-of-life.
    coordinates:
      - io.reactivex.rxjava3:rxjava
    reference:
      label: RxJava on GitHub
      url: https://github.com/ReactiveX/RxJava

  - id: rxjava2
    name: RxJava 2
    status: SUNSET
    summary: >-
      End-of-life since February 28, 2021: no further development, support, maintenance or
      updates of any kind.
    coordinates:
      - io.reactivex.rxjava2:rxjava
    succession:
      kind: SUPERSEDED_BY
      value: io.reactivex.rxjava3:rxjava
    reference:
      label: RxJava on GitHub
      url: https://github.com/ReactiveX/RxJava

  - id: rxjava1
    name: RxJava 1
    status: SUNSET
    summary: >-
      End-of-life since March 31, 2018: no further development, support, maintenance or
      updates of any kind.
    coordinates:
      - io.reactivex:rxjava
    succession:
      kind: SUPERSEDED_BY
      value: io.reactivex.rxjava3:rxjava
    reference:
      label: RxJava on GitHub
      url: https://github.com/ReactiveX/RxJava
