ecosystem: OTHER
projects:
  - id: spring-statemachine
    name: Spring Statemachine
    status: SUNSET
    summary: >-
      Discontinued and moved to the Spring attic. The repository is archived and no further
      releases of any kind are expected.
    coordinates:
      - org.springframework.statemachine:spring-statemachine-core
      - org.springframework.statemachine:spring-statemachine-starter
      - org.springframework.statemachine:spring-statemachine-autoconfigure
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: No successor project exists; replacing it means adopting another state machine library or hand-rolled state handling
    reference:
      label: Spring Statemachine in the attic
      url: https://github.com/spring-attic/spring-statemachine

  - id: commons-pool1
    name: Apache Commons Pool 1
    status: SUNSET
    summary: >-
      The 1.x line has not seen a release since 1.6 in 2013. Development continues only in Commons
      Pool 2, which lives under different coordinates.
    coordinates:
      - commons-pool:commons-pool
    succession:
      kind: SUPERSEDED_BY
      value: org.apache.commons:commons-pool2
    reference:
      label: Apache Commons Pool
      url: https://commons.apache.org/proper/commons-pool/
