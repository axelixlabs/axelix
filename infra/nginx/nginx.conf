events {}

http {

    upstream website {
        server axelix-website:3000;
    }

    server {
        listen 80;
        server_name axelix.io;

        return 301 https://$host$request_uri;
    }

    server {

        listen 443 ssl;
        server_name axelix.io;

        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/certificate.key;
        ssl_trusted_certificate /etc/nginx/ssl/certificate_ca.crt;

        # Website
        location / {
            proxy_pass http://website;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Docs. The Next.js app itself is configured with basePath "/docs" (see
        # docs/next.config.mjs), so every route and asset it serves already expects
        # to be addressed under /docs/. Unlike the old static Docusaurus build, this
        # container must receive the request URI unchanged — proxy_pass has no URI
        # component here on purpose, so nginx does not strip the /docs/ prefix.
        # The location pattern has no trailing slash either: Next.js's canonical
        # basePath root has none ("/docs", not "/docs/"), and a slash-terminated
        # location makes nginx auto-redirect the bare "/docs" request to "/docs/",
        # which then bounces straight back — an infinite redirect loop with the app.
        # axelix-docs is supposed to resolve onto axelix-docs container within a docker network
        location /docs {
            proxy_pass http://axelix-docs:3000;
            proxy_set_header Host $host;
        }

        # Blog
        location /blog {
            # axelix-docs is supposed to resolve onto axelix-docs container within a docker network
            proxy_pass http://axelix-blog:3000;
            proxy_set_header Host $host;
        }
    }
}