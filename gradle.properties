# The fleet default version. ALWAYS `X.Y.0` - a minor/major (fleet) release ships every component under it.
# Every component inherits this unless it pins its own axelixVersion in its local gradle.properties, which
# happens only on a component patch branch (see the commented axelixVersion in each subproject's gradle.properties).
axelixVersion=1.1.0-SNAPSHOT

# TODO: Do we still need it???
# Force Kotlin plugin to not add the Kotlin Standard Library to any configurations
# Instead we're doing it manually
kotlin.stdlib.default.dependency=false
