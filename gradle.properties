axelixVersion=1.2.0-SNAPSHOT

# The defaults (512m heap, 384m metaspace) are not enough for this build: the openapi-generator
# worker runs in classloader isolation, so its classes accumulate in the daemon metaspace with
# every contract generation task (currently 25 documents x 2 modules per build).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=2g

# TODO: Do we still need it???
# Force Kotlin plugin to not add the Kotlin Standard Library to any configurations
# Instead we're doing it manually
kotlin.stdlib.default.dependency=false
