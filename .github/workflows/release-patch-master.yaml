name: Release Patch Master

# Per-component patch release for Axelix Master. Run this workflow FROM the `X.Y.0-master` patch branch
# (forked from `v<X.Y.0>`), where the developer has already pinned axelixVersion in master-oss/gradle.properties
# to the new patch version. The workflow reads that version, rebuilds and pushes the Master OSS image, and tags
# `X.Y.Z-master` + a GitHub Release. The private Enterprise (unified) image ships under this same component/branch
# and is a deferred addition — when wired it must share this version, so its master-enterprise/gradle.properties
# would be pinned too (see wiki 02-versioning-and-components.adoc).

on:
  workflow_dispatch:

env:
  USERNAME: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_CONTAINER_REGISTRY: ghcr.io

jobs:
  security-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Running Security Check
        uses: ./.github/actions/security-check

  release:
    needs: [ security-check ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the patch version from master-oss/gradle.properties
        uses: madhead/read-java-properties@4
        id: version
        env:
          JAVA_HOME: ""
        with:
          file: master-oss/gradle.properties
          property: axelixVersion

      - name: Build and push the Master OSS image
        uses: ./.github/actions/release-oss-image
        with:
          version: ${{ steps.version.outputs.value }}
          owner: ${{ github.repository_owner }}
          registry: ${{ env.GITHUB_CONTAINER_REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the component release and publish the GitHub Release
        uses: ./.github/actions/finalize-component-release
        with:
          slug: master
          component-name: Axelix Master
          version: ${{ steps.version.outputs.value }}
          branch: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
