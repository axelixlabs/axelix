name: Release Patch Master

# Per-component patch release for Axelix Master. Automates the branch/tag dance: creates/reuses
# `X.Y.0-master` off `v<X.Y.0>`, pins axelixVersion in master-oss/gradle.properties, rebuilds and pushes
# the Master OSS image, and tags `X.Y.Z-master`. The private Enterprise (unified) image ships under this
# same component/branch and is a deferred addition — when wired it must share this version, so its
# master-enterprise/gradle.properties would be pinned too (see wiki 02-versioning-and-components.adoc).

on:
  workflow_dispatch:
    inputs:
      minor:
        description: Minor line to patch, "X.Y" (e.g. "1.1"). Its v<X.Y.0> fleet tag must already exist.
        type: string
        required: true

env:
  USERNAME: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_CONTAINER_REGISTRY: ghcr.io

jobs:
  security-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Running Security Check
        uses: ./.github/actions/security-check

  release:
    needs: [ security-check ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare the component patch branch
        id: prepare
        uses: ./.github/actions/prepare-component-patch
        with:
          slug: master
          module-dir: master-oss
          minor: ${{ inputs.minor }}

      - name: Build and push the Master OSS image
        uses: ./.github/actions/release-oss-image
        with:
          version: ${{ steps.prepare.outputs.version }}
          owner: ${{ github.repository_owner }}
          registry: ${{ env.GITHUB_CONTAINER_REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the component release
        uses: ./.github/actions/finalize-component-release
        with:
          slug: master
          version: ${{ steps.prepare.outputs.version }}
          branch: ${{ steps.prepare.outputs.branch }}
