name: Release Lockstep

# Lockstep release. Used to release either the Major or the Minor versions of Axelix project.

on:
  workflow_dispatch:

env:
  USERNAME: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_CONTAINER_REGISTRY: ghcr.io

jobs:
  starter-compatibility-tests:
    name: ${{ matrix.starterConfig.starter }} on Java ${{ matrix.starterConfig.javaVersion }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        starterConfig:
          - starter: Spring Boot 2 starter
            javaVersion: 11
            tasks: :sbs:axelix-spring-boot-2-starter:build
          - starter: Spring Boot 2 starter
            javaVersion: 17
            tasks: :sbs:axelix-spring-boot-2-starter:build
          - starter: Spring Boot 2 starter
            javaVersion: 21
            tasks: :sbs:axelix-spring-boot-2-starter:build
          - starter: Spring Boot 3 starter
            javaVersion: 17
            tasks: :sbs:axelix-spring-boot-3-starter:build
          - starter: Spring Boot 3 starter
            javaVersion: 21
            tasks: :sbs:axelix-spring-boot-3-starter:build
          - starter: Spring Boot 3 starter
            javaVersion: 24
            tasks: :sbs:axelix-spring-boot-3-starter:build
          - starter: Spring Boot 4 starter
            javaVersion: 17
            tasks: :sbs:axelix-spring-boot-4-starter:build
          - starter: Spring Boot 4 starter
            javaVersion: 21
            tasks: :sbs:axelix-spring-boot-4-starter:build
          - starter: Spring Boot 4 starter
            javaVersion: 25
            tasks: :sbs:axelix-spring-boot-4-starter:build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker

        # Master runs on Java 25
      - name: Set up starter test JDK and Gradle JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'liberica'
          java-version: |
            ${{ matrix.starterConfig.javaVersion }}
            25 

      - name: Run starter compatibility tests
        shell: bash
        # Both X64 and AARCH64 are listed since Gradle just ignores whichever env vars aren't set for this OS/arch.
        run: >-
          ./gradlew
          ${{ matrix.starterConfig.tasks }}
          -Paxelix.starter.tests.java.version=${{ matrix.starterConfig.javaVersion }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.starterConfig.javaVersion }}_X64,JAVA_HOME_${{ matrix.starterConfig.javaVersion }}_AARCH64,JAVA_HOME_25_X64,JAVA_HOME_25_AARCH64

  security-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Running Security Check
        uses: ./.github/actions/security-check

  release-artifacts:
    needs: [security-check, starter-compatibility-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version from gradle.properties
        id: version
        uses: ./.github/actions/read-axelix-version
        with:
          file: gradle.properties
          # A lockstep release must be a released X.Y.0 (no SNAPSHOT, patch always 0).
          pattern: '^[0-9]+\.[0-9]+\.0$'

      - name: Export release version to the job env
        run: |
          echo "RELEASE_TAG=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'liberica'
          java-version: '25'

      - name: Build and test the fleet
        run: |
          chmod +x ./gradlew
          ./gradlew clean build sourcesJar javadocJar

      - name: Publish Maven Artifacts to Maven Central
        uses: ./.github/actions/release-maven-artifact
        with:
          bw-access-token: ${{ secrets.BW_ACCESS_TOKEN }}
          # Every artifact the fleet publishes, stated explicitly.
          artifacts: |
            :sbs:axelix-spring-boot-2-starter
            :sbs:axelix-spring-boot-3-starter
            :sbs:axelix-spring-boot-4-starter
            :plugins:axelix-gradle-plugin
            :plugins:axelix-maven-plugin

      - name: Build and push the Master OSS image
        uses: ./.github/actions/release-oss-image
        with:
          version: ${{ env.RELEASE_TAG }}
          owner: ${{ github.repository_owner }}
          registry: ${{ env.GITHUB_CONTAINER_REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the fleet release tag
        uses: ./.github/actions/create-release-tag
        with:
          tag: v${{ env.RELEASE_TAG }}
