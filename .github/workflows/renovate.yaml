name: Renovate

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC on the first day of the month. GitHub starts this only from the default branch.
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  renovate:
    # Scheduled runs must only execute in the main Axelix repository, not in forks.
    if: github.event_name != 'schedule' || github.repository == 'axelixlabs/axelix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
