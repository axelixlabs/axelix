name: Release Pipeline

on:
  workflow_dispatch:

env:
  USERNAME: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_CONTAINER_REGISTRY: ghcr.io

jobs:
  starter-compatibility-tests:
    name: ${{ matrix.starterConfig.starter }} on Java ${{ matrix.starterConfig.javaVersion }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        starterConfig:
          - starter: Spring Boot 2 starter
            javaVersion: 11
            tasks: :sbs:axelix-spring-boot-2-starter:build
          - starter: Spring Boot 2 starter
            javaVersion: 17
            tasks: :sbs:axelix-spring-boot-2-starter:build
          - starter: Spring Boot 2 starter
            javaVersion: 21
            tasks: :sbs:axelix-spring-boot-2-starter:build
          - starter: Spring Boot 3 starter
            javaVersion: 17
            tasks: :sbs:axelix-spring-boot-3-starter:build
          - starter: Spring Boot 3 starter
            javaVersion: 21
            tasks: :sbs:axelix-spring-boot-3-starter:build
          - starter: Spring Boot 3 starter
            javaVersion: 24
            tasks: :sbs:axelix-spring-boot-3-starter:build
          - starter: Spring Boot 4 starter
            javaVersion: 17
            tasks: :sbs:axelix-spring-boot-4-starter:build
          - starter: Spring Boot 4 starter
            javaVersion: 21
            tasks: :sbs:axelix-spring-boot-4-starter:build
          - starter: Spring Boot 4 starter
            javaVersion: 25
            tasks: :sbs:axelix-spring-boot-4-starter:build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker

      - name: Set up starter test JDK and Gradle JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'liberica'
          java-version: |
            ${{ matrix.starterConfig.javaVersion }}
            25

      - name: Run starter compatibility tests
        shell: bash
        # Both X64 and AARCH64 are listed since Gradle just ignores whichever env vars aren't set for this OS/arch.
        run: >-
          ./gradlew
          ${{ matrix.starterConfig.tasks }}
          -Paxelix.starter.tests.java.version=${{ matrix.starterConfig.javaVersion }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.starterConfig.javaVersion }}_X64,JAVA_HOME_${{ matrix.starterConfig.javaVersion }}_AARCH64,JAVA_HOME_25_X64,JAVA_HOME_25_AARCH64

  security-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Running Security Check
        uses: ./.github/actions/security-check

  master-e2e-tests:
    uses: ./.github/workflows/nightly-master-e2e.yaml
    secrets: inherit

  playground-compatibility-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        id: setup-java-25
        with:
          distribution: 'liberica'
          java-version: '25'

      - name: Set up JDK 17 for Playgrounds
        uses: actions/setup-java@v5.6.0
        id: setup-java-17
        with:
          java-version: '17'
          distribution: 'liberica'

      - name: Set up JDK 21 for Playgrounds
        uses: actions/setup-java@v5.6.0
        id: setup-java-21
        with:
          java-version: '21'
          distribution: 'liberica'

      - name: Grant execution access to the wrapper
        run: chmod +x gradlew

      - name: Build every playground project
        env:
          JAVA_17_HOME: ${{ steps.setup-java-17.outputs.path }}
          JAVA_21_HOME: ${{ steps.setup-java-21.outputs.path }}
          JAVA_25_HOME: ${{ steps.setup-java-25.outputs.path }}
        run: make build-playground

  release-artifacts:
    needs:
      [
        security-check,
        starter-compatibility-tests,
        master-e2e-tests,
        playground-compatibility-tests,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version from gradle.properties
        id: version
        uses: ./.github/actions/read-axelix-version
        with:
          file: gradle.properties
          # A release must be a released X.Y.Z (no SNAPSHOT). Major, minor and patch releases are all
          # cut in lockstep from this single fleet-wide version.
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Export release version to the job env
        run: |
          echo "RELEASE_TAG=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Determine whether this release is the latest
        # A patch release cut on an older minor line (e.g. 1.0.5 after 1.1.0 shipped) must not
        # move the 'latest' image tag. The fleet release tags pushed by this pipeline are the
        # source of truth for what has been released so far; the tag for the version being
        # released right now is only pushed at the end of this job, hence RELEASE_TAG itself
        # is added to the comparison explicitly.
        run: |
          highest="$(printf '%s\n' "${RELEASE_TAG}" $(git tag --list 'v[0-9]*' | sed 's/^v//') | sort -V | tail -n 1)"
          echo "IS_LATEST_RELEASE=$([ "${highest}" = "${RELEASE_TAG}" ] && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Loading Secrets
        uses: ./.github/actions/bitwarden
        with:
          bw-access-token: ${{ secrets.BW_ACCESS_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'liberica'
          java-version: '25'

      - name: Build and test the fleet
        run: |
          chmod +x ./gradlew
          ./gradlew clean build sourcesJar javadocJar

      - name: Publish Maven Artifacts to Maven Central
        # The OSS artifacts, stated explicitly — the starters and the plugins. Signing (GPG) and the
        # OSSRH promote step run inside the Gradle build.
        run: >-
          ./gradlew
          :sbs:axelix-spring-boot-2-starter:publish
          :sbs:axelix-spring-boot-3-starter:publish
          :sbs:axelix-spring-boot-4-starter:publish
          :plugins:axelix-gradle-plugin:publish
          :plugins:axelix-maven-plugin:publish

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_CONTAINER_REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Master OSS image
        run: |
          ./gradlew :master-oss:bootJar
          image="${{ env.GITHUB_CONTAINER_REGISTRY }}/${{ github.repository_owner }}/axelix"
          tags=(--tag "${image}:${RELEASE_TAG}")
          if [ "${IS_LATEST_RELEASE}" = "true" ]; then
            tags+=(--tag "${image}:latest")
          fi
          docker build \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --file master-oss/Dockerfile \
            --push \
            master-oss

      - name: Docker logout from GitHub Container Registry
        if: always()
        run: docker logout ${{ env.GITHUB_CONTAINER_REGISTRY }}

      - name: Create and push the fleet release tag
        run: |
          git tag "v${RELEASE_TAG}"
          git push origin "v${RELEASE_TAG}"
