name: Finalize component release
description: >-
  Creates and pushes the component's release tag "<version>-<slug>" on the current (patch-branch) commit and
  publishes a GitHub Release for that tag, with notes rendered from .github/release-notes/patch-release-notes.md.
  The patch branch itself is pushed by the developer before the release runs; this action only tags what is
  already there. Runs only after the component has been published successfully.

inputs:
  slug:
    description: Component slug, e.g. "sbs-2".
    required: true
  component-name:
    description: Human-readable component name for the release notes, e.g. "Axelix Spring Boot 2 Starter".
    required: true
  version:
    description: The patch version being released, "X.Y.Z".
    required: true
  branch:
    description: The component patch branch the release is cut from, "X.Y.0-<slug>" (used in the notes).
    required: true
  github-token:
    description: 'Token used to create the GitHub Release (needs "contents: write").'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SLUG: ${{ inputs.slug }}
        COMPONENT_NAME: ${{ inputs.component-name }}
        VERSION: ${{ inputs.version }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail

        tag="${VERSION}-${SLUG}"

        if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
          echo "::error::Tag ${tag} already exists — refusing to overwrite a released component."
          exit 1
        fi

        # Build the changelog from the commits added on this patch branch since the previous release of THIS
        # component — its last "X.Y.*-<slug>" tag if it has been patched before, otherwise the fleet tag it
        # was forked from. The version-bump commit itself is filtered out.
        minor="${VERSION%.*}"
        prev="$(git tag -l "${minor}.*-${SLUG}" | sort -V | tail -n1)"
        base="${prev:-v${minor}.0}"
        CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' "${base}..HEAD" | grep -vE '^- release: ' || true)"
        [ -z "$CHANGES" ] && CHANGES="_No changelog entries for this patch._"
        export CHANGES TAG="$tag" MINOR="$minor"

        # Render the release notes from the template (only our placeholders are substituted).
        template="${GITHUB_WORKSPACE}/.github/release-notes/patch-release-notes.md"
        if [ ! -f "$template" ]; then
          echo "::error::Release notes template not found at ${template}."
          exit 1
        fi
        notes="$(mktemp)"
        envsubst '${COMPONENT_NAME} ${VERSION} ${TAG} ${BRANCH} ${MINOR} ${CHANGES}' < "$template" > "$notes"

        # Tag the current commit (the developer already pushed the branch) only after everything above succeeded.
        git tag "$tag"
        git push origin "$tag"
        echo "Tagged ${tag} on ${BRANCH}"

        # A per-component patch must NOT claim the "Latest" badge over the fleet release, hence --latest=false.
        gh release create "$tag" \
          --title "${COMPONENT_NAME} ${VERSION}" \
          --notes-file "$notes" \
          --latest=false
        echo "Published GitHub Release ${tag}"
