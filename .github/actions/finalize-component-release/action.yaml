name: Finalize component release
description: >-
  Creates and pushes the component's release tag "<version>-<slug>" on the current (patch-branch) commit.
  The patch branch itself is pushed by the developer before the release runs; this action only tags what is
  already there, and the developer creates the GitHub Release (with notes) manually afterwards. Runs only
  after the component has been published successfully.

inputs:
  slug:
    description: Component slug, e.g. "sbs-2".
    required: true
  version:
    description: The patch version being released, "X.Y.Z".
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SLUG: ${{ inputs.slug }}
        VERSION: ${{ inputs.version }}
      run: bash "${{ github.action_path }}/finalize-release.sh"
