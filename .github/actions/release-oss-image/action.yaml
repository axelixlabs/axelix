name: Release Master OSS image
description: >-
  Builds the Axelix Master OSS distribution boot JAR and pushes a multi-arch Docker image to the public
  container registry. 

inputs:
  version:
    description: Image tag, i.e. the resolved `master` version "X.Y.Z".
    required: true
  owner:
    description: Registry namespace / repository owner (e.g. github.repository_owner).
    required: true
  registry:
    description: Container registry host.
    required: false
    default: ghcr.io
  github-token:
    description: Token used to authenticate the docker push to the registry.
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v5.6.0
      with:
        distribution: liberica
        java-version: '25'

    - name: Build Master OSS boot JAR
      shell: bash
      run: |
        chmod +x ./gradlew
        ./gradlew :master-oss:bootJar

    - name: Set up Docker
      uses: docker/setup-docker-action@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Log in to the container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.owner }}
        password: ${{ inputs.github-token }}

    - name: Build and push the OSS image
      shell: bash
      # Build context is master-oss/ so the Dockerfile's `COPY build/libs/master.jar` resolves.
      run: |
        docker build \
          --platform linux/amd64,linux/arm64 \
          --tag ${{ inputs.registry }}/${{ inputs.owner }}/axelix:${{ inputs.version }} \
          --file master-oss/Dockerfile \
          --push \
          master-oss

    - name: Log out of the container registry
      if: always()
      shell: bash
      run: docker logout ${{ inputs.registry }}
