openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
components:
  schemas:
    LogLevelChangeRequest:
      x-axelix-server: master
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - configuredLevel
      properties:
        # INVALID: no 'x-axelix-introduced-in' on the property, and there is deliberately
        # no fallback to the document-level marker.
        configuredLevel:
          type: string
        ttlSeconds:
          type: integer
          format: int64
          x-axelix-introduced-in: 1.0.0
