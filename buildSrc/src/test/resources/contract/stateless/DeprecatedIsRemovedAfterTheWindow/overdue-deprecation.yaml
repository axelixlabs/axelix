openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
components:
  schemas:
    LogLevelChangeRequest:
      x-axelix-server: master
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        ttlSeconds:
          type: integer
          format: int64
          x-axelix-introduced-in: 1.0.0
          # INVALID against 1.4.0-SNAPSHOT: deprecated in 1.1.0, the window passed in 1.4 —
          # the property must be removed from the contract, keeping it is forbidden.
          x-axelix-deprecated-in: 1.1.0
