openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers/logger/{name}/change-level:
    post:
      operationId: changeLogLevelByLoggerName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogLevelChangeRequest'
      responses:
        '204':
          description: The logging level was changed.
components:
  schemas:
    # The Master produces this request, and a starter that reads the new property only ever
    # talks to Masters of its own version or newer — they all send it, so a property added
    # after the birth of the feature may be 'required' right away.
    LogLevelChangeRequest:
      type: object
      required:
        - configuredLevel
        - scope
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        scope:
          type: string
          x-axelix-introduced-in: 1.2.0
