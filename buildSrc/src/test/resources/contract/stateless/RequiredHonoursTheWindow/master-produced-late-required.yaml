openapi: 3.1.0
info:
  title: logger-level-change
  version: ""
components:
  schemas:
    # The Master produces this request, and a starter that reads the new property only ever
    # talks to Masters of its own version or newer — they all send it, so a property added
    # after the birth of the feature may be 'required' right away.
    LogLevelChangeRequest:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - configuredLevel
        - scope
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        scope:
          type: string
          x-axelix-introduced-in: 1.2.0
