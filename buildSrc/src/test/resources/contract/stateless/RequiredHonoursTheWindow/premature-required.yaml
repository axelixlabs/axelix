openapi: 3.1.0
info:
  title: loggers-list
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers:
    get:
      operationId: getLoggers
      responses:
        '200':
          description: The loggers of the service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggersReply'
components:
  schemas:
    # The starter produces this reply, so the Master receives it from the whole
    # compatibility window of starter versions.
    LoggersReply:
      type: object
      required:
        - loggers
        - effectiveLevel
      properties:
        loggers:
          type: string
          # Born with the feature: may be required from the start.
          x-axelix-introduced-in: 1.0.0
        effectiveLevel:
          type: string
          # INVALID: added in the release currently being built (1.2.0-SNAPSHOT), so starters
          # 1.0-1.1 within the window do not send it — it cannot be 'required' until 1.5.
          x-axelix-introduced-in: 1.2.0
