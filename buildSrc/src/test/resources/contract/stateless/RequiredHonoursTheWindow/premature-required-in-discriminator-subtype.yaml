openapi: 3.1.0
info:
  title: pets-feed
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: starter
paths:
  /actuator/axelix-pets:
    get:
      operationId: getPets
      responses:
        '200':
          description: The pets of the service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          x-axelix-introduced-in: 1.0.0
      discriminator:
        propertyName: kind
        mapping:
          DOG: '#/components/schemas/Dog'
    # The 'Dog' is reachable from the response only through the discriminator mapping of the
    # 'Pet', and the starter produces it, so the Master receives it from the whole compatibility
    # window of starter versions.
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - barkVolume
          properties:
            barkVolume:
              type: integer
              # INVALID: added in the release currently being built (1.2.0-SNAPSHOT), so starters
              # 1.0-1.1 within the window do not send it, it cannot be 'required' until 1.5.
              x-axelix-introduced-in: 1.2.0
