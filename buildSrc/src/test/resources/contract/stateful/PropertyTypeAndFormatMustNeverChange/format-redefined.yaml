openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
components:
  schemas:
    LogLevelChangeRequest:
      x-axelix-server: master
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        ttlSeconds:
          type: integer
          # INVALID: the released baseline declares this property as int64, and a released
          # property must never be redefined in place
          format: int32
          x-axelix-introduced-in: 1.0.0
