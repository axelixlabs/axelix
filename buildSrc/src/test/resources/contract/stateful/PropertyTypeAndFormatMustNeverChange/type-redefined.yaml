openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: master
components:
  schemas:
    LogLevelChangeRequest:
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          # INVALID: the released baseline declares this property as a string, and a released
          # property must never be redefined in place
          type: integer
          x-axelix-introduced-in: 1.0.0
        ttlSeconds:
          type: integer
          format: int64
          x-axelix-introduced-in: 1.0.0
