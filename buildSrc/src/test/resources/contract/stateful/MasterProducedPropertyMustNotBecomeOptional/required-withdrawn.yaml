openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: master
components:
  schemas:
    # INVALID: the released baseline lists configuredLevel as required in this master-produced
    # request; withdrawing 'required' is a hidden removal — the property must be deprecated and
    # stay required until the window passes
    LogLevelChangeRequest:
      type: object
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
    # The starter produces this reply.
    LogLevelChangeReply:
      type: object
      required:
        - effectiveLevel
      properties:
        effectiveLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
