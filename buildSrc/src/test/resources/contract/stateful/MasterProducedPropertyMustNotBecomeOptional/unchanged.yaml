openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
components:
  schemas:
    # The Master produces this request, so every starter within the window parses it.
    LogLevelChangeRequest:
      x-axelix-server: starter
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
    # The starter produces this reply.
    LogLevelChangeReply:
      x-axelix-server: starter
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - effectiveLevel
      properties:
        effectiveLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
