openapi: 3.1.0
info:
  title: logger-level-change
  version: ""
components:
  schemas:
    # The Master produces this request, so every starter within the window parses it.
    LogLevelChangeRequest:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
    # The starter produces this reply, and weakening 'required' here is legal: the Master is
    # never older than the starter it talks to, so its model already tolerates the absence.
    LogLevelChangeReply:
      x-axelix-produced-by: starter
      x-axelix-introduced-in: 1.0.0
      type: object
      properties:
        effectiveLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
