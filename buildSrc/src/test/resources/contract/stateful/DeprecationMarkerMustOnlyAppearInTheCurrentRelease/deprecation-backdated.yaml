openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers/logger/{name}/change-level:
    post:
      operationId: changeLogLevelByLoggerName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogLevelChangeRequest'
      responses:
        '204':
          description: The logging level was changed.
components:
  schemas:
    LogLevelChangeRequest:
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
          # INVALID: the released baseline does not deprecate this property, so the deprecation
          # appears only now (1.2.0) and may not pretend the window started back in 1.1.0
          x-axelix-deprecated-in: 1.1.0
        ttlSeconds:
          type: integer
          format: int64
          x-axelix-introduced-in: 1.0.0
          x-axelix-deprecated-in: 1.1.0
