openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
components:
  schemas:
    # deprecatedMaster was deprecated in 1.1.0; at 1.4.0 its compatibility window has passed, so the
    # master-produced property may finally be removed from the contract
    LogLevelChangeRequest:
      x-axelix-produced-by: master
      x-axelix-introduced-in: 1.0.0
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        undeprecatedMaster:
          type: string
          x-axelix-introduced-in: 1.0.0
