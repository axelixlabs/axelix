openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers/logger/{name}/change-level:
    post:
      operationId: changeLogLevelByLoggerName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogLevelChangeRequest'
      responses:
        '200':
          description: The logging level was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelChangeReply'
components:
  schemas:
    LogLevelChangeRequest:
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        deprecatedMaster:
          type: string
          x-axelix-introduced-in: 1.0.0
          x-axelix-deprecated-in: 1.1.0
        undeprecatedMaster:
          type: string
          x-axelix-introduced-in: 1.0.0
    # INVALID: deprecatedStarter was deprecated in 1.1.0 (a field update is under way); the Master
    # keeps fallback-reading it, so at 1.2.0 the property must stay until its window has passed
    LogLevelChangeReply:
      type: object
      required:
        - effectiveLevel
      properties:
        effectiveLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        pureStarter:
          type: string
          x-axelix-introduced-in: 1.0.0
