openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
  x-axelix-introduced-in: 1.0.0
  x-axelix-server: master
components:
  schemas:
    # INVALID: undeprecatedMaster is a master-produced property in the released baseline; dropping
    # it without a prior deprecation is a hidden removal that breaks starters still expecting it
    LogLevelChangeRequest:
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
        deprecatedMaster:
          type: string
          x-axelix-introduced-in: 1.0.0
          x-axelix-deprecated-in: 1.1.0
