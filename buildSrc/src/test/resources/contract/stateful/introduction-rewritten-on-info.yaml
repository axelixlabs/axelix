openapi: 3.1.0
info:
  title: logger-level-change
  version: 1.0.0
  # INVALID: the released baseline knows this operation as introduced in 1.0.0, and the
  # introduction marker of an already released part may never be rewritten
  x-axelix-introduced-in: 1.1.0
  x-axelix-server: starter
paths:
  /actuator/axelix-loggers/logger/{name}/change-level:
    post:
      operationId: changeLogLevelByLoggerName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogLevelChangeRequest'
      responses:
        '204':
          description: The logging level was changed.
components:
  schemas:
    LogLevelChangeRequest:
      type: object
      required:
        - configuredLevel
      properties:
        configuredLevel:
          type: string
          x-axelix-introduced-in: 1.0.0
